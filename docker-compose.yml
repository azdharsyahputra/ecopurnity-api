# Local infrastructure: PostgreSQL primary + streaming replica, ClickHouse, Mailpit (catches outgoing email) and
# SeaweedFS (S3-compatible object storage standing in for Cloudflare R2).
#   make up      start everything       make down    stop (keeps data)       make reset   stop and wipe volumes
name: ecopurnity

services:
  postgres-primary:
    image: postgres:17
    environment:
      POSTGRES_USER: ecopurnity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecopurnity}
      POSTGRES_DB: ecopurnity
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c wal_keep_size=256MB
      -c hot_standby=on
    ports: ["5432:5432"]
    volumes:
      - pg-primary:/var/lib/postgresql/data
      - ./deploy/postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecopurnity -d ecopurnity"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-replica:
    image: postgres:17
    depends_on:
      postgres-primary: { condition: service_healthy }
    environment:
      POSTGRES_USER: ecopurnity
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    ports: ["5433:5432"]
    volumes:
      - pg-replica:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: ecopurnity
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native protocol (used by the API)
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Dev SMTP catcher: the API sends to localhost:1025, read the mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible object storage standing in for Cloudflare R2 (presigned PUT/GET, SigV4). S3 API on :8333.
  seaweedfs:
    image: chrislusf/seaweedfs:3.99
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports:
      - "8333:8333"
    volumes:
      - seaweed-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Any HTTP answer from the S3 port means it is up (anonymous requests get 403).
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pg-primary:
  pg-replica:
  ch-data:
  seaweed-data:
