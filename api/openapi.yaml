                type: integer
        events:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/ReputationEvent"
    ReputationTx:
      type: object
      description: |
        Transaction fields reputation is computed from: Pick<TransactionDetail, id | title | status | counterparty |
        totalIdr | createdAt | updatedAt | dueAt | timeline | dispute> plus optional role and reviews.
      required:
        - id
        - title
        - status
        - counterparty
        - totalIdr
        - createdAt
        - updatedAt
        - dueAt
        - timeline
      properties:
        id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/TransactionStatus"
