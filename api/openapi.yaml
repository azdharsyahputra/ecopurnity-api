    post:
      tags:
        - Organization
      operationId: createOrgProcurement
      summary: Create a procurement request
      description: 'Creates the request with code `PRQ-xxxx`, `requiredApprovers` from the approval rules for the budget (rules with `appliesTo` containing `procurement` and `minAmountIdr` strictly below `budgetIdr`), and `approvals: []`. With `submit: false` the status is `draft`. With `submit: true` the status is `approved` when no approver is required, otherwise `pending_approval`; in that case every member whose role is a pending approver (except the caller) gets an in-app notification "Perlu approval kamu: {code}" (type `transaction_update`, href `/org/{orgId}/procurement/{id}`).'
      x-access: org:procurement.create
      x-audit: true
      x-note: "`categoryId`, `spec` and `deliveryLocation` are not validated. A missing `invitedSupplierIds` with `visibility: invite` is a server error rather than 422."
