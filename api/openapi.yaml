    put:
      tags:
        - Organization
      operationId: updateOrgTeamSettings
      summary: Save roles, permissions, departments and approval rules
      description: "Replaces the four settings blocks wholesale. Approval rules decide `requiredApprovers` for new procurement requests and auctions: every rule whose `appliesTo` includes the subject and whose `minAmountIdr` is strictly below the value contributes its approver roles (deduplicated, in rule order). Already-created requests keep the approvers they were created with (procurement is re-evaluated on `submit`). The audit entry lists which blocks changed."
      x-access: org:team.manage
      x-audit: true
      x-note: "Not validated: that `permissions` keys refer to existing roles, that rule `approvers` refer to existing roles, or that owner stays intact (owner permissions are hard-wired to everything in `can()` anyway). A body missing `approvalRules` or `roles` is a server error."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgTeamSettingsInput"
      responses:
        "200":
          description: Full settings after the update.
