          $ref: "#/components/schemas/PartyRef"
        totalIdr:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        timeline:
          type: array
          items:
            type: object
            required:
              - status
            properties:
              status:
                $ref: "#/components/schemas/TransactionStatus"
              at:
                type: string
                format: date-time
              note:
                type: string
