    post:
      operationId: actOnAdminDispute
      summary: Request evidence, start review or resolve a dispute
      description: |
        Workflow (status -> action): `open|evidence` -> `request_evidence` (-> `evidence`) or `start_review` (-> `review`);
        `review` -> `resolve` (-> `resolved`). Any other combination is 409 `invalid_transition` (after schema validation of the
        body, before the reason check).
        - `request_evidence`: `from` (buyer | supplier | both) and `reason` (min 10 chars) required. Adds a timeline entry
          "Bukti diminta dari {pembeli|supplier|kedua pihak}: {reason}" and sends a `transaction_update` notification
          "{code}: Admin meminta bukti" (body = reason) to the selected platform-user parties.
        - `start_review`: reason optional. Timeline entry "Review dimulai".
        - `resolve`: `resolution` and `reason` (min 10 chars) required. Resolution kinds: `refund` (buyer gets the full total
          back; transaction -> `cancelled`, payment `refunded`), `release` (supplier gets the full total; transaction ->
          `completed`, payment `released`), `partial` (`refundIdr` must be an integer > 0 and < transaction total; buyer gets
          refundIdr back, supplier the rest; transaction -> `completed`, payment `released`). Invalid partial amounts return
          422 `validation` with fields.refundIdr. Effects: transaction status/payment/updatedAt updated (the completed timeline
          step gets "Putusan dispute: ..." note), stored resolution `{ ...resolution, refundIdr, releaseIdr, reason, at, by }`,
          timeline "Diputuskan: ...", notification "{code} diputuskan" to both parties, audit "Putuskan dispute (refund penuh |
          lepas dana | refund sebagian)" with status diffs.
        Audit is written for every action ("Minta bukti dispute", "Mulai review dispute", resolve).
        Money: the resolution row is stored on the case and the trade side (trade status, invoice payment state, escrow
        ledger journal) is settled in the same transaction by the transactions area.
      tags:
        - Admin
      x-access: capability:admin
      x-audit: true
      x-note: The mock does not validate `from` on request_evidence nor the shape of `resolution`; the API answers 422 `validation` (schema). `request_evidence` while already in `evidence` is allowed and repeats the request. `partial` amounts are against the trade total before tax (`totalIdr`), like the mock.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeActionInput"
      responses:
        "200":
          description: The updated case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeCase"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "not_found: case does not exist."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "invalid_transition: the action is not available for the case status."
        "422":
          $ref: "#/components/responses/Validation"
          description: "reason_required: fields.reason (request_evidence and resolve; min 10 chars after trim). validation: fields.refundIdr (partial resolution amount must be an integer > 0 and < transaction total)."
