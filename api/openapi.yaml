        - cancellationRate
        - disputeRate
        - volumeIdr
        - repeatRate
        - responseHours
        - ratingAvg
        - ratingCount
      properties:
        fulfillmentRate:
          type:
            - number
            - "null"
          description: Completed / finished (completed, cancelled, disputed). Null without finished transactions.
        onTimeRate:
          type:
            - number
            - "null"
          description: Completed on or before the due date / completed.
        cancellationRate:
          type:
            - number
            - "null"
        disputeRate:
          type:
            - number
            - "null"
        volumeIdr:
          type: integer
          description: Rupiah of completed transactions.
        repeatRate:
          type:
            - number
            - "null"
          description: Completed transactions with a counterparty seen more than once / completed.
        responseHours:
          type:
            - number
            - "null"
          description: Average hours from agreement to the next step.
        ratingAvg:
          type:
            - number
            - "null"
          description: Average 1-5 rating counterparties gave this account.
        ratingCount:
          type: integer
