      description: |
        Email verification is a 6-digit one-time code (OTP), emailed on register and on resend. The user is signed in
        right after registering, so this needs the session; the code is checked against the user's latest code.
        - A code is valid for 10 minutes and allows 5 attempts; the 5th wrong attempt burns it (`too_many_attempts`), and
          the user asks for a new one with `POST /auth/resend-verification`.
        - A verified account answers 200 with the user (idempotent).
        - Only an HMAC of the code (keyed by the server secret) is stored.
      tags:
        - Auth
      x-access: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPublicVerifyEmailRequest"
