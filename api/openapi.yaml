      operationId: getOrgTransaction
      summary: Get an organization transaction
      description: "Full trade detail (terms, agreement, invoice, shipments, QC, dispute with evidence, reviews, timeline, documents) plus the team `activity` for it and, for a sub-PO created by collective pool settlement (`group.id` is the pool), `collective`: the pool's pro-rata split with the pool id, title and unit (masked as in `GET /orgs/{orgId}/collective`, own line carries `transactionId`)."
      x-access: org:member
