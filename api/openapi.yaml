                  - name
                  - text
                  - at
                properties:
                  id:
                    type: string
                  by:
                    $ref: "#/components/schemas/Role"
                  name:
                    type: string
                  text:
                    type: string
                  file:
                    type: string
                  at:
                    type: string
                    format: date-time
        role:
          $ref: "#/components/schemas/Role"
        reviews:
          type: object
          properties:
            buyer:
              $ref: "#/components/schemas/Review"
            supplier:
              $ref: "#/components/schemas/Review"
    Resolution:
      description: refund = buyer gets everything back, order cancelled; release = supplier gets everything, order completes; partial = buyer gets `refundIdr` back, supplier the rest, order completes.
      oneOf:
        - $ref: "#/components/schemas/ResolutionRefund"
        - $ref: "#/components/schemas/ResolutionRelease"
        - $ref: "#/components/schemas/ResolutionPartial"
      discriminator:
        propertyName: kind
        mapping:
          refund: "#/components/schemas/ResolutionRefund"
          release: "#/components/schemas/ResolutionRelease"
          partial: "#/components/schemas/ResolutionPartial"
    ResolutionOutcome:
      type: object
      required:
        - status
        - payment
        - refundIdr
        - releaseIdr
        - note
      properties:
        status:
          $ref: "#/components/schemas/TransactionStatus"
        payment:
          type: string
          enum:
            - unpaid
            - escrow
            - released
            - refunded
          description: TransactionDetail["payment"]["status"].
        refundIdr:
          type: integer
        releaseIdr:
          type: integer
        note:
          type: string
          description: Human summary for the timeline and notifications.
    ResolutionPartial:
      type: object
      description: '`{ kind: "partial", refundIdr }` variant of Resolution. refundIdr must be an integer > 0 and less than the transaction total.'
      required:
        - kind
        - refundIdr
      properties:
        kind:
          type: string
          const: partial
        refundIdr:
          type: integer
          exclusiveMinimum: 0
    ResolutionRefund:
      type: object
      description: '`{ kind: "refund" }` variant of Resolution.'
      required:
        - kind
      properties:
        kind:
          type: string
          const: refund
    ResolutionRelease:
      type: object
      description: '`{ kind: "release" }` variant of Resolution.'
      required:
        - kind
      properties:
        kind:
          type: string
          const: release
    Review:
      type: object
      required:
