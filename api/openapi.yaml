  /orgs/{orgId}/transactions/{tid}/actions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: tid
        in: path
        required: true
        description: Transaction id.
        schema:
          type: string
    post:
      tags:
        - Organization
      operationId: actOnOrgTransaction
      summary: Take a step on an organization trade
      description: |-
        Shared F6 trade action endpoint (same body and rules as the personal `POST /me/transactions/{id}/actions`), taken by the organization on its side of the trade (`role` of the transaction: buyer for procurement POs, supplier for selling auctions).

        Role gate (PRD 9.8): money moves by Finance, goods by Operations, commitments by Procurement/Sales. Built-in roles follow this table; a custom role may take any action when it has transactions.manage.

        | Action | Roles that may take it |
        |---|---|
        | accept_agreement | owner, procurement, sales |
        | issue_invoice | owner, finance, sales |
        | pay | owner, finance |
        | ship | owner, operations |
        | upload_proof | owner, operations |
        | confirm_receipt | owner, procurement, operations |
        | cancel | owner, procurement |
        | dispute | owner, procurement |
        | add_evidence | owner, procurement, operations |
        | review | owner, procurement |

        The role gate runs before the state machine. Then the action must be available for the org's side in the current status, otherwise `409 invalid_transition`. Per action: `ship` needs `shipment` (quantity > 0 and <= unscheduled quantity, `dropPoint`), `upload_proof` needs `file`, `confirm_receipt` takes `qc` (outcome `partial` needs `acceptedQty` between 1 and quantity-1, any non-`accepted` outcome needs a `note`; `rejected` opens a dispute), `dispute` and `add_evidence` need `note`, `review` needs `review.rating` 1-5.

        Side effects: the action is written as an audit entry on the org (with a status change diff); the transaction timeline and documents are updated; the peer account is notified when the counterparty is a platform account. Fictional counterparties are played by a bot that advances the trade (agreement, invoice, payment, shipment, delivery proof, receipt, review) about 8 s after each change and notifies every org member (type `payment`, `delivery` or `transaction_update`, href `/org/{orgId}/transactions/{id}`).
      x-access: org:transactions.manage
      x-audit: true
      x-note: "`x-access` shows the custom-role fallback; built-in roles are gated by the per-action table in the description. A missing or unknown `action` is a server error (403 check indexes TX_ACTION_ROLES with it)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeActionInput"
      responses:
        "200":
          description: Updated transaction page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgTransactionPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
          description: "unauthenticated: no session."
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 'forbidden: the caller is not a member of this organization. Also forbidden: the role may not take this action: "{action label} hanya untuk {roles}; peranmu {role}", or for custom roles "Peran {role} tidak punya izin kelola Transactions".'
        "404":
          $ref: "#/components/responses/NotFound"
          description: "not_found: transaction does not exist."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "invalid_transition: action not available in the current status for the org's side."
        "422":
          $ref: "#/components/responses/Validation"
          description: "fields per action: quantity, dropPoint (ship), file (upload_proof), acceptedQty and note (confirm_receipt QC), note (dispute, add_evidence), rating (review)."
