  /orgs/{orgId}/procurement/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: id
        in: path
        required: true
        description: Procurement request id.
        schema:
          type: string
    post:
      tags:
        - Organization
      operationId: actOnOrgProcurement
      summary: Take a workflow action on a procurement request
      description: |-
        One endpoint for the request workflow. The action must be in the set currently available to the caller's role (`procurementActions`), otherwise `409 invalid_action` (also used when the role lacks permission: no 403).

        | Action | Available when | Role needs | Effect |
        |---|---|---|---|
        | submit | status `draft` | procurement.manage or procurement.create | Recomputes `requiredApprovers` from the approval rules, status becomes `approved` (no approver needed) or `pending_approval` (approvers notified as in create). |
        | approve | `pending_approval` | caller's role is a still-pending required approver | Records an approval; status becomes `approved` when every required role has approved. |
        | reject | `pending_approval` | same as approve | Requires `note`. A single rejection sets status `rejected`. |
        | publish | `approved` | procurement.manage or procurement.create | Status `published`. |
        | collective | `approved` or `published` | collective.create | Joins (or creates) the open collective pool with the same category and unit; status `in_collective`, `poolId` set, `visibility` forced to `aggregate`. |
        | cancel | `draft`, `pending_approval`, `approved`, `published` | procurement.manage or procurement.create | Status `cancelled`. |

        Collective: pool quantity is `quantity` (defaults to the request quantity) and `optIn` (default false) controls whether the business name is shown to other pool members. When no open matching pool exists a new one is created from the request (base price = budget / quantity, `refQty` = request quantity, `thresholdQty` = 8 x request quantity, region from the last part of the org location, default "Jawa Barat").
      x-access: org:member
      x-audit: true
      x-note: 'Permission failures surface as 409 `invalid_action`, not 403. The 403 from the approve/reject path is unreachable because availability already requires canApprove. `approve` does not notify the remaining approvers of a multi-step rule. Audit labels: Ajukan procurement, Publish procurement, Batalkan procurement, Gabungkan ke collective; approve/reject write "Approve procurement" / "Tolak procurement" (reject carries `reason`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgProcurementActionInput"
      responses:
        "200":
          description: Updated request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
          description: "unauthenticated: no session."
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "forbidden: the caller is not a member of this organization. Also forbidden: (approve/reject only) caller role is not waiting for approval; effectively unreachable."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "not_found: request does not exist."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "invalid_action: the action is not available for this status or role."
        "422":
          $ref: "#/components/responses/Validation"
          description: "fields: note (reject requires a reason), quantity (collective: must be > 0)."
