openapi: 3.1.0
info:
  title: Ecopurnity API
  version: 1.0.0
  summary: Economic network platform API, derived from the frontend's reference mock (MSW).
  description: |
    Backend contract for the Ecopurnity frontend. Every endpoint here is implemented by a handler in the
    frontend repo (`src/mocks/*`); those handlers are the reference behaviour and this document is their
    formal description. Where the two disagree, fix the document or the mock together.

    ## Conventions
    - Base path `/api/v1`. JSON only. camelCase. Times are ISO 8601 UTC strings. Money is an integer number of
      Rupiah in fields named `…Idr`. Quantities are `{ value, unit }`.
    - **Session**: httpOnly cookie `ecp_session`, set by `POST /auth/login` and `/auth/register`. The frontend
      treats `GET /auth/me` as the source of truth (`401` = signed out, `403 account_suspended` = suspended).
    - **Errors** always have the body `{ "error": { "code", "message", "fields"? } }`. `fields` maps input names to
      messages and is rendered under the matching inputs. Punitive admin / market maker actions require a `reason`
      (`422` with `fields.reason` otherwise).
    - **Lists** that are paginated take `?page=&pageSize=` (default pageSize 12, max 50) and return
      `{ data: [...], meta: { page, pageSize, total } }`. Filters are plain query params (`q`, `category`,
      `region`, `status`).
    - **Audit**: every mutating governance, market maker and organization action writes an `AuditEntry` (marked
      `x-audit: true` on the operation).
    - **Access** is stated per operation in `x-access`: `public`, `session` (any signed-in user), `capability:<name>`
      (`market_maker`, `admin`, ...), or `org:<resource>.<action>` (organization role permission).
    - **Realtime** is a WebSocket (`GET /api/v1/ws`) described in `api/asyncapi.yaml` and `docs/realtime.md`:
      events are `{ channel, type, seq?, payload, ts }` on channels `public:stats`, `public:activity`, `auction:{id}`
      (`AuctionEvent`), `user:{id}` (`AppNotification`, own-bid status, trade updates) and `conversation:{id}`.

    ## Error codes shared by many endpoints
    `unauthenticated` (401), `forbidden` (403), `not_found` (404), `validation` (422), `invalid_transition` (409).
    Endpoint-specific codes are listed on the operation's response.
  contact:
    name: Ecopurnity engineering
servers:
  - url: http://localhost:8080/api/v1
    description: Local
tags:
  - name: Auth
    description: Sign-up, sign-in, session, password reset, suspension appeal
  - name: Public
    description: Public economy reads (explorer, opportunities, markets, auctions, search, profiles)
  - name: Personal
    description: Participant workspace under /me (identity, listings, bids, transactions, finance, contracts, notifications)
  - name: Matching
    description: Smart matching and reputation
  - name: RFQ
    description: Requests for quotation, quotes, counter-offers, conversations
  - name: Verification
    description: Phone OTP and KTP verification, commitment limits
  - name: Uploads
    description: Presigned uploads to object storage (S3-compatible / Cloudflare R2)
  - name: Roles
    description: Market maker applications, organization invitations, creating organizations
  - name: Organization
    description: Business workspace under /orgs/{orgId}
  - name: MarketMaker
    description: Market operations under /mm
  - name: Admin
    description: Governance under /admin
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ecp_session
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    Q:
      name: q
      in: query
      description: Free-text search over the list's name/code fields.
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        $ref: "#/components/schemas/CategoryId"
    Region:
      name: region
      in: query
      schema:
        type: string
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization id. The caller must be a member (403 otherwise).
      schema:
        type: string
  responses:
    Unauthenticated:
      description: Not signed in (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Signed in but not allowed (`forbidden`, `account_restricted`, `kyc_limit`, org role denied, ...).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource does not exist or is not visible to the caller (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The resource is in a state that does not allow this (`invalid_transition`, `already_*`, ...).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Validation:
      description: Input rejected (`validation`). `error.fields` names the offending inputs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    AccountStatus:
      type: string
      enum:
        - active
        - restricted
        - suspended
    Action:
      type: string
      enum:
        - view
        - create
        - approve
        - manage
    ActivityEvent:
      type: object
      required:
        - id
        - type
        - title
        - at
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/ActivityType"
        title:
          type: string
        amountIdr:
          type: integer
        at:
          type: string
          format: date-time
    ActivityType:
      type: string
      enum:
        - opportunity_detected
        - market_formed
        - auction_started
        - bid_placed
        - auction_closed
        - transaction_completed
    AdminAlertDetail:
      description: FraudAlert plus audit entries whose action text mentions the alert code (case history).
      allOf:
        - $ref: "#/components/schemas/FraudAlert"
        - type: object
          required:
            - audit
          properties:
            audit:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"
    AdminAuction:
      allOf:
        - $ref: "#/components/schemas/Auction"
        - type: object
          required:
            - findings
          properties:
            findings:
              type: array
              items:
                $ref: "#/components/schemas/Finding"
    AdminAuctionActionRequest:
      type: object
      required:
        - action
      properties:
        action:
          $ref: "#/components/schemas/AuctionAction"
        reason:
          type: string
          description: Required for every action (trimmed length at least 10, else 422 `reason_required`). For `open_case` it becomes the first investigation note.
        type:
          allOf:
            - $ref: "#/components/schemas/AlertType"
          description: Only for `open_case`; the fraud type of the new case. Defaults to `bid_manipulation`.
    AdminAuctionDetail:
      allOf:
        - $ref: "#/components/schemas/AdminAuction"
        - type: object
          required:
            - minStepIdr
            - bids
            - audit
          properties:
            minStepIdr:
              type: integer
            bids:
              description: Null while a sealed auction is still open; bids are only unsealed after close.
              oneOf:
                - type: "null"
                - type: array
                  items:
                    $ref: "#/components/schemas/AdminBid"
            caseId:
              type: string
            audit:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"
    AdminBid:
      type: object
      required:
        - id
        - bidder
        - masked
        - priceIdr
        - at
      properties:
        id:
          type: string
        bidder:
          type: string
          description: Real identity; participants only ever see the masked label.
        masked:
          type: string
        priceIdr:
          type: integer
        at:
          type: string
          format: date-time
    AdminCaseOpened:
      type: object
      required:
        - caseId
      properties:
        caseId:
          type: string
          description: Id of the new manual FraudAlert (investigating).
    AdminMarket:
      allOf:
        - $ref: "#/components/schemas/Market"
        - type: object
          required:
            - flags
            - reports
            - disputes
          properties:
            flags:
              type: array
              items:
                $ref: "#/components/schemas/MarketFlag"
            reports:
              type: array
              items:
                $ref: "#/components/schemas/UserReport"
            disputes:
              type: integer
            reviewedAt:
              type: string
              format: date-time
    AdminMarketActionRequest:
      type: object
      required:
        - action
      properties:
        action:
          $ref: "#/components/schemas/MarketAction"
        reason:
          type: string
          description: Required for `flag`, `suspend`, `restore` (trimmed length at least 10); optional for `review`. For `flag` it becomes the flag label.
    AdminMarketDetail:
      description: AdminMarket plus the market's auctions (with findings) and its audit entries, newest first.
      allOf:
        - $ref: "#/components/schemas/AdminMarket"
        - type: object
          required:
            - auctions
            - audit
          properties:
            auctions:
              type: array
              items:
                $ref: "#/components/schemas/AdminAuction"
            audit:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"
    AdminOk:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
    AdminOverview:
      type: object
      required:
        - queues
        - newAlerts
        - openDisputes
        - sla
      properties:
        queues:
          type: object
          required:
            - users
            - verification
            - markets
            - auctions
            - disputes
            - fraud
          properties:
            users:
              type: integer
            verification:
              type: integer
            markets:
              type: integer
            auctions:
              type: integer
            disputes:
              type: integer
            fraud:
              type: integer
        newAlerts:
          type: array
          items:
            $ref: "#/components/schemas/FraudAlert"
        openDisputes:
          type: array
          items:
            $ref: "#/components/schemas/DisputeSummary"
        sla:
          type: array
          description: Items waiting longer than their review SLA.
          items:
            type: object
            required:
              - module
              - label
              - slaHours
              - total
              - breached
            properties:
              module:
                type: string
                enum:
                  - verification
                  - disputes
              label:
                type: string
              slaHours:
                type: number
              total:
                type: integer
              breached:
                type: integer
              oldestAt:
                type: string
                format: date-time
    AdminUser:
      type: object
      required:
        - id
        - name
        - username
        - email
        - kind
        - capabilities
        - verified
        - status
        - joinedAt
        - reputation
        - transactions
        - reportCount
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: string
        location:
          type: string
        kind:
          type: string
          enum:
            - person
            - business
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        verified:
          type: boolean
          description: Identity verified by an admin.
        status:
          $ref: "#/components/schemas/AccountStatus"
        joinedAt:
          type: string
          format: date-time
        reputation:
          type: number
        transactions:
          type: integer
        reportCount:
          type: integer
    AdminUserActionRequest:
      type: object
      required:
        - action
      properties:
        action:
          $ref: "#/components/schemas/UserAction"
        reason:
          type: string
          description: "Required: trimmed length at least 10 (checked by the handler: 422 `reason_required`); recorded in the audit trail (and as the appeal decision note when an appeal is decided)."
    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required:
            - reports
            - history
            - orgs
            - audit
          properties:
            appeal:
              $ref: "#/components/schemas/Appeal"
            reports:
              type: array
              items:
                $ref: "#/components/schemas/UserReport"
            history:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
            orgs:
              type: array
              items:
                type: string
            audit:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"
    AdminVerificationActionRequest:
      type: object
      required:
        - action
      properties:
        action:
          $ref: "#/components/schemas/VerificationAction"
        reason:
          type: string
          description: Required for `reject` and `reupload` (trimmed length at least 10). Optional for `approve` (decision note defaults to "Dokumen sesuai").
    AdminVerificationStatus:
      description: Declared as `VerificationStatus` in features/admin/types.ts; renamed because org.ts exports an unrelated `VerificationStatus`.
      type: string
      enum:
        - pending
        - approved
        - rejected
        - reupload
    AggregateRow:
      type: object
      required:
        - categoryId
        - item
        - region
        - quantity
        - listings
        - trend
      properties:
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        item:
          type: string
        region:
          type: string
        quantity:
          $ref: "#/components/schemas/Quantity"
        listings:
          type: integer
        trend:
          type: number
          description: 30-day change, fraction.
    AlertActionClose:
      type: object
      description: Dismiss or close an alert; both require a reason.
      required:
        - action
        - reason
      properties:
        action:
          type: string
          enum:
            - dismiss
            - close
        reason:
          type: string
    AlertActionEscalate:
      type: object
      required:
        - action
        - subjectId
        - escalation
        - reason
      properties:
        action:
          type: string
          const: escalate
        subjectId:
          type: string
        escalation:
          $ref: "#/components/schemas/EscalationAction"
        reason:
          type: string
    AlertActionInput:
      description: Body of an admin fraud alert action.
      oneOf:
        - $ref: "#/components/schemas/AlertActionInvestigate"
        - $ref: "#/components/schemas/AlertActionNote"
        - $ref: "#/components/schemas/AlertActionClose"
        - $ref: "#/components/schemas/AlertActionEscalate"
      discriminator:
        propertyName: action
        mapping:
          investigate: "#/components/schemas/AlertActionInvestigate"
          note: "#/components/schemas/AlertActionNote"
          dismiss: "#/components/schemas/AlertActionClose"
          close: "#/components/schemas/AlertActionClose"
          escalate: "#/components/schemas/AlertActionEscalate"
    AlertActionInvestigate:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          const: investigate
    AlertActionNote:
      type: object
      required:
        - action
        - text
      properties:
        action:
          type: string
          const: note
        text:
          type: string
    AlertStatus:
      type: string
      enum:
        - new
        - investigating
        - escalated
        - dismissed
        - closed
    AlertType:
      type: string
      enum:
        - bid_manipulation
        - collusion
        - fake_accounts
        - abnormal_bidding
        - wash_trading
        - price_manipulation
        - transaction_network
    AllocationLine:
      type: object
      required:
        - offerId
        - supplier
        - quantity
        - priceIdr
      properties:
        offerId:
          type: string
        supplier:
          type: string
        quantity:
          type: number
        priceIdr:
          type: integer
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              examples:
                - validation
            message:
              type: string
              description: Human-readable, Indonesian.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Input name to message.
    ApiErrorBody:
      $ref: "#/components/schemas/ApiError"
      description: Error envelope; identical to ApiError.
    Appeal:
      type: object
      required:
        - reason
        - at
        - status
      properties:
        reason:
          type: string
        at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - granted
            - denied
        decision:
          type: object
          required:
            - at
            - by
            - note
          properties:
            at:
              type: string
              format: date-time
            by:
              type: string
            note:
              type: string
    AppNotification:
      type: object
      required:
        - id
        - type
        - title
        - body
        - href
        - at
        - read
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        body:
          type: string
        href:
          type: string
        at:
          type: string
          format: date-time
        read:
          type: boolean
    Approval:
      type: object
      required:
        - role
        - by
        - at
        - decision
      properties:
        role:
          type: string
        by:
          type: string
        at:
          type: string
          format: date-time
        decision:
          type: string
          enum:
            - approved
            - rejected
        note:
          type: string
    ApprovalRule:
      type: object
      required:
        - id
        - label
        - minAmountIdr
        - approvers
        - appliesTo
      properties:
        id:
          type: string
        label:
          type: string
        minAmountIdr:
          type: integer
          description: Applies when the value is strictly above this.
        approvers:
          type: array
          description: Role ids that must each approve.
          items:
            type: string
        appliesTo:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalSubject"
    ApprovalSubject:
      type: string
      enum:
        - procurement
        - auction
    Auction:
      type: object
      required:
        - id
        - code
        - title
        - marketId
        - marketName
        - categoryId
        - type
        - status
        - lot
        - startsAt
        - endsAt
        - participants
        - bidCount
        - visibility
        - openingPriceIdr
      properties:
        id:
          type: string
        code:
          type: string
        title:
          type: string
        marketId:
          type: string
        marketName:
          type: string
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        type:
          $ref: "#/components/schemas/AuctionType"
        status:
          $ref: "#/components/schemas/AuctionStatus"
        lot:
          type: object
          required:
            - item
            - quantity
            - spec
          properties:
            item:
              type: string
            quantity:
              $ref: "#/components/schemas/Quantity"
            spec:
              type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        participants:
          type: integer
        bidCount:
          type: integer
        visibility:
          $ref: "#/components/schemas/BidVisibility"
        openingPriceIdr:
          type: integer
        currentPriceIdr:
          type: integer
          description: Best bid per unit so far (lowest for reverse, highest for forward); absent for sealed. Current ask for Dutch.
    AuctionAction:
      type: string
      enum:
        - freeze
        - unfreeze
        - open_case
    AuctionDetail:
      allOf:
        - $ref: "#/components/schemas/Auction"
        - type: object
          required:
            - rules
            - minStepIdr
            - extension
            - bids
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/LabeledValue"
            minStepIdr:
              type: integer
            extension:
              type: object
              required:
                - windowMinutes
                - extendMinutes
              properties:
                windowMinutes:
                  type: integer
                extendMinutes:
                  type: integer
            bids:
              type: array
              items:
                $ref: "#/components/schemas/PublicBid"
              description: Newest first; empty for sealed auctions.
    AuctionEvaluation:
      type: object
      required:
        - auction
        - offers
        - suggestion
      properties:
        auction:
          $ref: "#/components/schemas/AuctionDetail"
        demand:
          $ref: "#/components/schemas/DemandListing"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Offer"
        suggestion:
          type: object
          required:
            - lines
            - totalIdr
            - savingsIdr
            - reason
          properties:
            lines:
              type: array
              items:
                $ref: "#/components/schemas/AllocationLine"
            totalIdr:
              type: integer
            savingsIdr:
              type: integer
            reason:
              type: string
          description: "Smart Allocation: cheapest reliable split that covers the lot."
    AuctionEvent:
      description: Payloads on the `auction:{id}` channel.
      oneOf:
        - $ref: "#/components/schemas/AuctionEventBid"
        - $ref: "#/components/schemas/AuctionEventExtended"
        - $ref: "#/components/schemas/AuctionEventPrice"
        - $ref: "#/components/schemas/AuctionEventClosed"
      discriminator:
        propertyName: kind
        mapping:
          bid: "#/components/schemas/AuctionEventBid"
          extended: "#/components/schemas/AuctionEventExtended"
          price: "#/components/schemas/AuctionEventPrice"
          closed: "#/components/schemas/AuctionEventClosed"
    AuctionEventBid:
      type: object
      required:
        - kind
        - bid
        - bidCount
        - participants
      properties:
        kind:
          const: bid
        bid:
          $ref: "#/components/schemas/PublicBid"
        currentPriceIdr:
          type: integer
        bidCount:
          type: integer
        participants:
          type: integer
    AuctionEventClosed:
      type: object
      required:
        - kind
        - status
      properties:
        kind:
          const: closed
        status:
          $ref: "#/components/schemas/AuctionStatus"
    AuctionEventExtended:
      type: object
      required:
        - kind
        - endsAt
      properties:
        kind:
          const: extended
        endsAt:
          type: string
          format: date-time
    AuctionEventPrice:
      type: object
      required:
        - kind
        - currentPriceIdr
      properties:
        kind:
          const: price
        currentPriceIdr:
          type: integer
    AuctionObjective:
      type: string
      enum:
        - procurement
        - selling
    AuctionStatus:
      type: string
      enum:
        - scheduled
        - qualification
        - live
        - extended
        - closed
        - awarded
        - cancelled
        - frozen
      description: Auction lifecycle status.
    AuctionType:
      type: string
      enum:
        - forward
        - reverse
        - sealed
        - dutch
    AuditEntry:
      type: object
      required:
        - id
        - actor
        - action
        - entity
        - at
      properties:
        id:
          type: string
        actor:
          type: string
          description: Who did it, e.g. "Sari Kusuma (Admin)" or "Sistem".
        action:
          type: string
          description: Verb phrase, e.g. "Suspend market".
        entity:
          type: object
          required:
            - type
            - id
            - label
          properties:
            type:
              type: string
              enum:
                - user
                - business
                - opportunity
                - market
                - auction
                - alert
                - transaction
                - dispute
                - rule
                - procurement
                - supplier
            id:
              type: string
            label:
              type: string
        at:
          type: string
          format: date-time
        reason:
          type: string
          description: Required for punitive actions (suspend, freeze, reject...).
        changes:
          type: array
          items:
            type: object
            required:
              - field
            properties:
              field:
                type: string
              before:
                type: string
              after:
                type: string
          description: "Field-level diff: what changed, before to after."
    AuthPublicAppealRequest:
      type: object
      required:
        - email
        - password
        - reason
      description: Suspended accounts cannot sign in, so the appeal re-checks the credentials.
      properties:
        email:
          type: string
        password:
          type: string
        reason:
          type: string
          description: Min 20 characters after trimming; checked by the handler after the credentials and appeal checks (422 fields.reason).
    AuthPublicAuctionPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Auction"
        meta:
          $ref: "#/components/schemas/PageMeta"
    AuthPublicDirectOrderRequest:
      type: object
      required:
        - listingId
        - quantity
      properties:
        listingId:
          type: string
