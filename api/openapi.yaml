      operationId: createOrgAuction
      summary: Create a business auction
      description: |-
        Creates the auction (code `OAU-xxxx`, lots get ids `lot-1..n`, `multiLot` is derived from the lot count, `valueIdr` = sum of quantity x reserve price). Required approvers come from the approval rules for `valueIdr` (rules with `appliesTo` containing `auction`).

        - With approvers: status `pending_approval`; pending approvers are notified (type `transaction_update`, href `/org/{orgId}/auctions?review={id}`). It goes live only after every required role approves (`POST .../auctions/{aid}/actions`).
        - Without approvers: it opens immediately: one realtime auction is created per lot (published as public auctions `oau-...`, owned by the org owner) and status becomes `scheduled` or `live`. Lots whose start time has passed start on a 5 s timer.
        - If `procurementId` points to a request in status `approved` or `published`, that request becomes `in_auction` immediately (even while the auction waits for approval).
      x-access: org:auctions.create
      x-audit: true
      x-note: Audit label is "Ajukan auction untuk approval" or "Buka auction". `categoryId`, `type`, `rules`, `qualification` are not validated. A `startsAt` up to 60 s in the past is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgAuctionInput"
      responses:
        "201":
          description: Created auction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAuctionView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
          description: "unauthenticated: no session."
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks auctions.create."
        "422":
          $ref: "#/components/responses/Validation"
          description: "fields: title (required), lots (at least one lot), lot-{index} (item, quantity.value > 0 and reservePriceIdr > 0 required), duration (`schedule.durationMinutes` > 0), startsAt (more than 60 s in the past)."
  /orgs/{orgId}/auctions/{aid}/actions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: aid
        in: path
        required: true
        description: Business auction id (`OrgAuction.id`).
        schema:
          type: string
    post:
      tags:
        - Organization
      operationId: decideOrgAuction
      summary: Approve or reject an auction
      description: Records the caller's approval for the role it holds. Allowed only while the auction is `pending_approval` and the caller's role is still a pending required approver (the org's approval rules, not the `auctions.approve` permission). When every required role has approved the auction opens as in create (lots go live, status `scheduled` or `live`). One rejection sets status `rejected` and returns a linked procurement request (`in_auction`) to `approved`. A rejection requires `note`, which is stored on the approval and as the audit `reason`.
      x-access: org:member
      x-audit: true
      x-note: Any `action` other than `approve` is treated as a rejection. Remaining approvers of a multi-step rule are not notified after a partial approval. Audit labels "Approve auction" / "Tolak auction".
