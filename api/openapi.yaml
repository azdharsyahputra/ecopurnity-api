      description: |
        Frontend action union. `type` selects the endpoint (`phone` POST /me/kyc/phone, `otp` POST /me/kyc/phone/verify,
        `identity` POST /me/kyc/identity); the request body is the rest of the object without `type`.
      oneOf:
        - $ref: "#/components/schemas/KycActionPhone"
        - $ref: "#/components/schemas/KycActionOtp"
        - $ref: "#/components/schemas/KycActionIdentity"
      discriminator:
        propertyName: type
        mapping:
          phone: "#/components/schemas/KycActionPhone"
          otp: "#/components/schemas/KycActionOtp"
          identity: "#/components/schemas/KycActionIdentity"
