paths:
  /admin/alerts:
    get:
      operationId: listAdminAlerts
      summary: List fraud alerts
      description: All alerts (system-detected and manual cases), newest `detectedAt` first. Not paginated.
      tags:
        - Admin
      x-access: capability:admin
      responses:
        "200":
          description: Fraud alerts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FraudAlert"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/alerts/{id}:
    get:
      operationId: getAdminAlert
      summary: Get a fraud alert with its case history
      description: The alert plus `audit`, the audit entries whose action text contains the alert code (opening, notes, escalation, close).
      tags:
        - Admin
      x-access: capability:admin
      x-note: The mock matches the alert code as a substring of the action text (`FRD-1041` would also match `FRD-10410`); the API returns entries on this alert entity plus the escalated actions tagged "(eskalasi {code})".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Alert detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAlertDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "not_found: alert does not exist."
  /admin/alerts/{id}/actions:
    post:
      operationId: actOnAdminAlert
      summary: Investigate, annotate, dismiss, close or escalate a fraud alert
      description: |
        Lifecycle: `new` -> `investigating` -> `escalated` | `dismissed` | `closed`.
        - `investigate`: only from `new` (409 `invalid_state` otherwise). Sets `investigating` and creates the investigation
          `{ openedAt, by, notes: [] }`. No reason needed. Audit "Buka investigasi {code} ({type label})".
        - Every other action requires an open case (status `investigating`), else 409 `no_case`.
        - `note`: `text` required (trimmed non-empty; 422 `validation` fields.text). Appends an investigation note, audit
          "Catatan {code}: {text}". No reason needed.
        - `dismiss` / `close`: `reason` required (min 10 chars). Status -> `dismissed` / `closed` and a resolution
          ("Ditolak: bukan pelanggaran" / "Ditutup tanpa tindakan"). Audit "Dismiss {code}" / "Tutup {code}".
        - `escalate`: `reason`, `subjectId` and `escalation` required. The subject must be one of the alert's subjects and the
          escalation must fit its type: user -> `suspend_user` | `restrict_user`; auction -> `freeze_auction`; market ->
          `suspend_market`; otherwise 422 `validation` with fields.subjectId. Performs the action exactly as the direct admin
          endpoints do (user status change, auction freeze with realtime event and owner notification, market suspension), with the
          audit text suffixed "(eskalasi {code})". Then sets alert status `escalated` with a resolution outcome
          ("Suspend|Batasi|Freeze {subject label}"), audit "Eskalasi {code}: {outcome}". 404 `not_found` if a user subject no
          longer exists; 409 `not_active` if an auction subject is no longer scheduled/qualification/live/extended.
        The reason check (422 `reason_required`) runs after the `no_case` check and before escalation validation.
      tags:
        - Admin
      x-access: capability:admin
      x-audit: true
      x-note: The mock treats an unknown `action` as `close`; the API answers 422 `validation`. An escalation subject (user, auction or market) that no longer exists is 404 `not_found` (the mock throws for auctions); `suspend_market` does not check the market is already suspended (no 409 no_change, unlike the market action endpoint). A user escalation that would not change the status (already suspended) still succeeds here, the 409 no_change of the user endpoint is not applied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertActionInput"
      responses:
        "200":
          description: The updated alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudAlert"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "not_found: alert does not exist, or (escalate) the user subject does not exist."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "invalid_state: investigate on an alert that is not new. no_case: any other action while the alert is not investigating. not_active: escalation target auction is no longer active."
        "422":
          $ref: "#/components/responses/Validation"
          description: "reason_required: fields.reason (dismiss, close, escalate; min 10 chars after trim). validation: fields.text (note is empty) or fields.subjectId (subject/escalation mismatch)."
  /admin/auctions:
    get:
      operationId: listAdminAuctions
      summary: List auctions with moderation findings
      description: Every auction (public Auction shape) plus `findings`. Not paginated.
      tags:
        - Admin
      x-access: capability:admin
      responses:
        "200":
          description: Auctions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAuction"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/auctions/{id}:
    get:
      operationId: getAdminAuction
      summary: Get an auction with the unmasked bid ledger and findings
      description: |
        `bids` carries real bidder identities and is `null` while a sealed auction is still scheduled/qualification/live/extended
        (bids unseal only after close). `findings` combines open fraud alerts on this auction (non-dismissed) with rule-based
        detections: "Bid beruntun" (3+ consecutive bids by one bidder) and "Lonjakan harga" (price jump over 20x the minimum
        step). `caseId` is the id of an `investigating` fraud alert on this auction, if any.
      tags:
        - Admin
      x-access: capability:admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Auction governance detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuctionDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "not_found: auction does not exist."
  /admin/auctions/{id}/actions:
    post:
      operationId: actOnAdminAuction
      summary: Freeze or unfreeze an auction, or open a fraud case on it
      description: |
        Reason is required for every action (422 `reason_required`, checked before the 409s).
        - `freeze`: only auctions in scheduled/qualification/live/extended. Remembers the previous status, sets status
          `frozen` (bids, the auction clock and winner selection are held), publishes an `auction.state` frame (status
          `frozen`) on channel `auction:{id}`, notifies the owner of a personal buyer auction (`auction_ending` "{title}
          dibekukan Admin"), audit "Freeze auction". 409 `not_active` otherwise.
        - `unfreeze`: only when `frozen` (409 `not_frozen` otherwise). Restores the remembered status and publishes
          `auction.state`; an auction whose `endsAt` passed while frozen is closed by the auction clock on its next tick
