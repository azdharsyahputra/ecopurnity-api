      type: object
      description: ktpFile and selfieFile are required by the server although optional in the type.
      required:
        - type
        - nik
        - fullName
      properties:
        type:
          type: string
          const: identity
        nik:
          type: string
          pattern: ^\d{16}$
        fullName:
          type: string
          minLength: 1
        ktpFile:
          type: string
        selfieFile:
          type: string
