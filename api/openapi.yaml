        Buyer: accept, counter, decline. Supplier: revise, accept_counter, withdraw.
        Accepting creates the trade at the agreed price (the counter price when the supplier accepts a counter).
    QuoteStatus:
      type: string
      enum:
        - submitted
        - countered
        - accepted
        - declined
        - withdrawn
    RealtimeMessage:
      type: object
