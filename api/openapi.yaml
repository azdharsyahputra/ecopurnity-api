        "401":
          $ref: "#/components/responses/Unauthenticated"
          description: "unauthenticated: no session."
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "forbidden: the caller is not a member of this organization. Also forbidden: this approval is not waiting for the caller's role (`Approval ini tidak menunggu peran {role}`)."
        "404":
          $ref: "#/components/responses/NotFound"
