      description: "Negotiation rules, only while the RFQ is open. Buyer: `accept` (from submitted), `counter` (from submitted), `decline` (from submitted or countered). Supplier (owner of the quote): `revise` (from submitted or countered, back to submitted), `accept_counter` (from countered), `withdraw` (from submitted or countered). A caller who is neither the buyer nor the quote's supplier gets 403. `accept` / `accept_counter` create the trade at the quoted price (the counter price for `accept_counter`) with the quote's terms and quantity, mark the quote accepted, decline the other open quotes, set the RFQ `awarded` with its `transactionId`, write an audit entry and notify the other party (supplier: `winning_bid`). They are checked against the acting user's KYC commitment limit. The other actions update the quote history and notify the other party. A fictional supplier answers a counter after about 6 seconds: accepts when the counter is at least 95% of its price, else revises to the midpoint."
