  /orgs/{orgId}/auctions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags:
        - Organization
      operationId: listOrgAuctions
      summary: List organization auctions
      description: "All business auctions, newest first. `status` is derived from the lots' live status: `live` while any lot runs, `scheduled` before start, `closed` when all are done, `awarded` after award; `pending_approval` and `rejected` are stored. `live[]` has one entry per lot (index-aligned with `lots`) with realtime facts; `bestPriceIdr` is hidden (absent) on sealed auctions while live."
