        - timeliness
        - communication
        - text
        - by
        - at
      properties:
        rating:
          type: number
          description: 1-5
          minimum: 1
          maximum: 5
        quality:
          type: number
        timeliness:
          type: number
        communication:
          type: number
        text:
          type: string
        by:
          type: string
        at:
          type: string
          format: date-time
