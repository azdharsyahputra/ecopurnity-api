  /me/transactions/{id}/actions:
    post:
      operationId: applyMyTransactionAction
      summary: Apply a trade action to a transaction
      description: |
        One endpoint for the whole settlement flow (PRD F6). The body is a `TradeActionInput`: `action` plus the
        action-specific fields. The action must be allowed for the caller's role and the current trade state, else
        `409 invalid_transition`. Order terms are `escrow` or `net14`/`net30`.

        Available actions (role / state):
        - `accept_agreement`: status `agreement` and the caller's side has not accepted yet. Records the side's acceptance and an agreement document.
        - `issue_invoice`: supplier, status `agreement`, both sides accepted. Status becomes `invoiced`; due date = +3 days (escrow) or terms days + 5.
        - `pay`: buyer. Escrow terms: status `invoiced` (payment becomes `escrow`, status `paid`). Net terms: status `accepted` (payment `released`, status `completed`).
        - `ship`: supplier, with unscheduled quantity left, status `paid`/`fulfilling` (escrow) or `invoiced`/`fulfilling` (net). Needs `shipment` {quantity (>0, <= unscheduled quantity), dropPoint (required), carrier (default `Armada supplier`), scheduledAt (default now)}. Status `fulfilling`.
        - `upload_proof`: supplier, status `fulfilling` with at least one open shipment. Needs `file`; delivers `shipmentId` (or the first open shipment). Status becomes `delivered` once every unit is on a delivered shipment, else stays `fulfilling`.
        - `confirm_receipt`: buyer, status `delivered`. Optional `qc` {outcome `accepted` (default) | `partial` (acceptedQty between 1 and quantity-1, note required) | `rejected` (note required)}. accepted: escrow releases payment and the status is `completed`, net terms go to `accepted` and set a payment due date; partial: quantity and total shrink to the accepted amount (escrow refund of the shortfall incl. PPN is computed), same status flow as accepted; rejected: opens a dispute with the note as evidence, status `disputed`, no release.
        - `cancel`: either side, status `agreement` or `invoiced`. An escrowed payment becomes `refunded`. Status `cancelled`.
        - `dispute`: either side, status `paid`/`fulfilling`/`delivered` (escrow) or `fulfilling`/`delivered`/`accepted` (net). Needs `note` (reason); optional `file`. Status `disputed`.
        - `add_evidence`: either side, status `disputed`. Needs `note`; optional `file`. Moves the dispute from `open` to `evidence`.
        - `review`: either side, status `completed` and the caller's side has not reviewed yet. Needs `review` {rating 1-5, quality, timeliness, communication, text}.

        Side effects: one trade row serves both sides, so the counterparty sees the new state at once (`peer.txId` is the
        same id); a counterparty that is a platform account is notified (`payment` for pay, `delivery` for ship/upload_proof,
        else `transaction_update`) and both sides get a `trade.updated` frame on `user:{id}`. A timeline step timestamp is
        set when the status changes; an audit entry is written (reason = `note`). Money moves as balanced ledger journals
        (pay into escrow; release to the supplier minus the platform and maker fees on confirm_receipt (escrow) or pay (net
        terms); partial QC refunds the short quantity incl. PPN to the buyer's available balance). External counterparties
        (not on the platform) are played by a bot only when the server runs with `SIMULATE_COUNTERPARTIES` (demo).
      tags:
        - Personal
      x-access: session
      x-audit: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeActionInput"
      responses:
        "200":
          description: The caller's updated transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
          description: not_found.
        "409":
          $ref: "#/components/responses/Conflict"
          description: "invalid_transition: action not available for the caller's role in the current status (also upload_proof with no open shipment)."
        "422":
          $ref: "#/components/responses/Validation"
          description: |
            validation, with fields: ship -> quantity (required, max unscheduled), dropPoint (required); upload_proof -> file; confirm_receipt -> acceptedQty (partial only), note (partial/rejected); dispute -> note; add_evidence -> note; review -> rating (1-5).
      x-note: Same engine is reused by the organization transaction actions endpoint. The KYC commitment limit is not re-checked on actions.
