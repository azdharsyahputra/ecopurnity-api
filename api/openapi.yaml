      summary: List organization transactions
      description: "Trades of the organization on the F6 model (from awarded auctions via PO, from collective pool settlement, or created elsewhere), in storage order (newest first). Summary fields only: `timeline`, `documents`, `payment`, `delivery`, `dispute`, `shipments` and `reviews` are omitted (use the detail endpoint). Not paginated."
