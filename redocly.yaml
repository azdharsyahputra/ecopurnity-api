extends:
  - recommended
rules:
  # Tuned for a spec written from a working mock: the mock is the reference, so we keep these strict where it matters.
  operation-operationId: error
  operation-4xx-response: off
  no-unused-components: warn
  operation-summary: error
  tag-description: off
  info-license: off
  no-server-example.com: off
  security-defined: error
