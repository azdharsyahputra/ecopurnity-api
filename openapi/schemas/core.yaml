    by:
      type: string
      description: Display name of the author.
    userId:
      type: string
      description: Author's user id; absent for external (non-platform) participants.
    text:
      type: string
    at:
      type: string
      format: date-time
    seq:
      type: integer
      description: Position in the conversation (`messages.seq`), gapless from 1.
    clientMsgId:
      type: string
      description: The sender's idempotency key (uuid), present on messages posted with one.
