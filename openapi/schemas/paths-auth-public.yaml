# Inline request/response shapes for paths/auth-public.yaml (prefix AuthPublic).
AuthPublicLoginRequest:
  type: object
  required: [email, password]
  properties:
    email: { type: string, description: Trimmed and lower-cased before lookup. }
    password: { type: string }
AuthPublicRegisterRequest:
  type: object
  required: [name, email, password]
  properties:
    name: { type: string, description: Trimmed. }
    email: { type: string, description: Trimmed and lower-cased; the username is its local part. }
    password: { type: string, description: 'Min 8 characters; checked by the handler after email uniqueness (422 fields.password).' }
AuthPublicAppealRequest:
  type: object
  required: [email, password, reason]
  description: Suspended accounts cannot sign in, so the appeal re-checks the credentials.
  properties:
    email: { type: string }
    password: { type: string }
    reason: { type: string, description: 'Min 20 characters after trimming; checked by the handler after the credentials and appeal checks (422 fields.reason).' }
AuthPublicOk:
  type: object
  required: [ok]
  properties:
    ok: { type: boolean, const: true }
AuthPublicVerifyEmailRequest:
  type: object
  required: [code]
  properties:
    code: { type: string, pattern: '^[0-9]{6}$', description: The 6-digit code from the verification email. }
AuthPublicForgotPasswordRequest:
  type: object
  required: [email]
  properties:
    email: { type: string }
AuthPublicResetPasswordRequest:
  type: object
  required: [token, password]
  properties:
    token: { type: string, description: Token from the reset email link. }
    password: { type: string, description: 'Min 8 characters; checked by the handler after the token (422 fields.password, the token stays valid).' }
AuthPublicOpportunityPage:
  type: object
  required: [data, meta]
  properties:
    data: { type: array, items: { $ref: '#/components/schemas/Opportunity' } }
    meta: { $ref: '#/components/schemas/PageMeta' }
AuthPublicMarketPage:
  type: object
  required: [data, meta]
  properties:
    data: { type: array, items: { $ref: '#/components/schemas/Market' } }
    meta: { $ref: '#/components/schemas/PageMeta' }
AuthPublicAuctionPage:
  type: object
  required: [data, meta]
  properties:
    data: { type: array, items: { $ref: '#/components/schemas/Auction' } }
    meta: { $ref: '#/components/schemas/PageMeta' }
AuthPublicPublicListingPage:
  type: object
  required: [data, meta]
  properties:
    data: { type: array, items: { $ref: '#/components/schemas/PublicListing' } }
    meta: { $ref: '#/components/schemas/PageMeta' }
AuthPublicMatchActionRequest:
  type: object
  required: [action]
  properties:
    action:
      type: string
      enum: [connect, save, dismiss, reset]
      description: connect sets the match to `connected`, save to `saved`, dismiss to `dismissed`, reset back to `new`.
    reason: { type: string, description: 'Optional free text; trimmed, stored with the match state.' }
AuthPublicKycPhoneRequest:
  type: object
  required: [phone]
  properties:
    phone:
      type: string
      description: Non-digits are stripped; the digits must match `^(62|0)8\d{7,11}$`.
      examples: ['0812xxxxxxxx']
AuthPublicKycPhoneVerifyRequest:
  type: object
  required: [code]
  properties:
    code: { type: string, description: The OTP sent to the phone. The mock accepts the fixed code `246810`. }
AuthPublicKycIdentityRequest:
  type: object
  required: [nik, fullName, ktpUploadId, selfieUploadId]
  properties:
    nik: { type: string, pattern: '^\d{16}$' }
    fullName: { type: string, minLength: 1, description: As on the KTP; trimmed. }
    ktpUploadId: { type: string, description: 'Upload id (POST /uploads, purpose kyc_ktp) of the KTP photo.' }
    selfieUploadId: { type: string, description: 'Upload id (POST /uploads, purpose kyc_selfie) of the selfie holding the KTP.' }
AuthPublicPriceSuggestion:
  description: The suggestion plus the unit it was computed for and the markets whose price history fed it.
  allOf:
    - $ref: '#/components/schemas/PriceSuggestion'
    - type: object
      required: [unit, markets]
      properties:
        unit: { type: string, description: 'The unit from the request, trimmed and lower-cased.' }
        markets:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
AuthPublicDirectOrderRequest:
  type: object
  required: [listingId, quantity]
  properties:
    listingId: { type: string, description: A public supply listing posted in this market. }
    quantity: { type: number, exclusiveMinimum: 0, description: 'At most the listing''s remaining quantity.' }
AuthPublicDirectOrderResponse:
  type: object
  required: [transactionId]
  properties:
    transactionId: { type: string, description: The buyer's side of the created transaction. }
UploadPurpose:
  type: string
  enum: [kyc_ktp, kyc_selfie, org_document]
  description: What the file is for; decides the allowed types, the size limit and who may read it. More purposes are added with the features that need them.
UploadRequest:
  type: object
  required: [purpose, fileName, contentType, sizeBytes]
  properties:
    purpose: { $ref: '#/components/schemas/UploadPurpose' }
    fileName: { type: string, minLength: 1, maxLength: 200, description: Original file name; shown to reviewers. }
    contentType: { type: string, description: MIME type the file will be uploaded with. }
    sizeBytes: { type: integer, minimum: 1 }
UploadTicket:
  type: object
  required: [uploadId, method, url, headers, expiresAt]
  properties:
    uploadId: { type: string, description: Pass this to the endpoint that uses the file. }
    method: { type: string, enum: [PUT] }
    url: { type: string, description: Presigned URL; PUT the raw file bytes here. }
    headers:
      type: object
      additionalProperties: { type: string }
      description: Headers the PUT must send exactly (Content-Type, Content-Length).
    expiresAt: { type: string, format: date-time }
