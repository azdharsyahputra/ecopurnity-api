/search:
  get:
    operationId: search
    summary: Search the public economy
    description: |
      Case-insensitive substring match over title and subtitle of opportunities, markets, auctions, market makers
      (`business`) and auction lots (`product`, or `service` for the `it` and `logistics` categories). An empty `q`
      returns an empty list.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - name: q
        in: query
        schema: { type: string }
      - name: type
        in: query
        description: Restrict to one hit type.
        schema: { $ref: '#/components/schemas/SearchType' }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, default: 50 }
    responses:
      '200':
        description: Hits.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/SearchHit' }

/me/reputation:
  get:
    operationId: getMyReputation
    summary: Get my reputation report
    description: Score, breakdown, counts and trend computed from the user's transactions.
    tags: [Matching]
    x-access: session
    responses:
      '200':
        description: The report.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReputationReport' }
      '401': { $ref: '#/components/responses/Unauthenticated' }

/me/matches:
  get:
    operationId: listMyMatches
    summary: List my smart matches
    description: |
      Pairs what the user can offer (available/in_market/reserved supply listings and capacity items in their identity)
      with open opportunities in the same category whose demand exceeds supply. Up to two opportunities per item, scored
      by category, distance vs delivery radius, coverage and engine confidence, best first; at most two `new` matches
      per opportunity. Matches the user already acted on are always kept.
    tags: [Matching]
    x-access: session
    responses:
      '200':
        description: Matches, best first.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Match' }
      '401': { $ref: '#/components/responses/Unauthenticated' }

/me/matches/{id}:
  post:
    operationId: actOnMatch
    summary: Connect, save, dismiss or reset a match
    description: |
      Sets the match state (`connect` -> connected, `save` -> saved, `dismiss` -> dismissed, `reset` -> new).
      `connect` also makes the user follow the opportunity (if not already related) and, once per match, opens a
      conversation titled `Match: <opportunity title>` with the market maker (or an opportunity team placeholder) and
      posts an opening message. When the maker is a registered user they get a notification
      (`opportunity_detected`, title `<name> ingin terhubung`, href `/app/messages/{conversationId}`); otherwise an
      automated reply is scheduled. Reconnecting reuses the existing conversation.
    tags: [Matching]
    x-access: session
    parameters:
      - { name: id, in: path, required: true, description: 'Match id: `<haveId>--<opportunityId>`.', schema: { type: string } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicMatchActionRequest' }
    responses:
      '200':
        description: The match with its new state (and `conversationId` once connected).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Match' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: the match is not among the user''s current matches.' }
      '422': { $ref: '#/components/responses/Validation', description: 'validation: unknown action.' }
    x-note: The returned `state` can be `connected`, `saved`, `dismissed` or `new`; the `Match.state` enum covers this. The match lookup (404) runs before the action check (422).

/profiles/u/{username}:
  get:
    operationId: getPersonProfile
    summary: Get a public person profile
    description: |
      Public view of a participant: reputation, verification, offered supply (available/in_market only), joined markets,
      org names and up to 6 recent public activities (finished transactions with the counterparty hidden, offered
      supply). Suspended and restricted users stay viewable with their `status`.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    responses:
      '200':
        description: The profile.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicProfile' }
      '404': { $ref: '#/components/responses/NotFound' }

/profiles/b/{slug}:
  get:
    operationId: getBusinessProfile
    summary: Get a public business profile
    description: |
      Business profile by slug (slugified name). Businesses come from market makers, user organizations, business
      accounts and verification submissions. Lists the markets the business operates and their non-cancelled auctions.
      Verified businesses show the documents NIB, NPWP and Akta pendirian.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    responses:
      '200':
        description: The profile.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessProfile' }
      '404': { $ref: '#/components/responses/NotFound' }

/me/kyc:
  get:
    operationId: getMyKyc
    summary: Get my verification level and limits
    description: Level 0 email (Rp 10 jt), 1 email + phone (Rp 100 jt), 2 KTP verified (Rp 2 M). The limit applies per commitment (bid, Dutch accept, buyer auction, accepted quote, direct order); exceeding it fails with `403 kyc_limit`.
    tags: [Verification]
    x-access: session
    responses:
      '200':
        description: Verification status.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Kyc' }
      '401': { $ref: '#/components/responses/Unauthenticated' }

/me/kyc/phone:
  post:
    operationId: requestPhoneOtp
    summary: Send a phone verification code
    description: Sends an OTP to the number, valid for 5 minutes; a new request replaces the pending one. The mock does not send anything and accepts only the fixed code `246810`.
    tags: [Verification]
    x-access: session
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicKycPhoneRequest' }
    responses:
      '200':
        description: 'Status with `otpPending: true`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Kyc' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: phone (Indonesian mobile number, 08... or 628..., 9 to 13 digits).' }

/me/kyc/phone/verify:
  post:
    operationId: verifyPhoneOtp
    summary: Verify the phone code
    description: 'Marks the phone verified (level 1) and clears the pending OTP. Checks run in this order: pending and unexpired OTP, then the code.'
    tags: [Verification]
    x-access: session
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicKycPhoneVerifyRequest' }
    responses:
      '200':
        description: Updated status.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Kyc' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '409': { $ref: '#/components/responses/Conflict', description: 'otp_expired: no pending OTP or it expired; request a new one.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: code (does not match). The OTP stays pending.' }
    x-note: 'The verified phone number is not stored, only the `phone: true` flag. There is no attempt limit on wrong codes.'

/me/kyc/identity:
  post:
    operationId: submitKtpVerification
    summary: Submit KTP and selfie for verification
    description: |
      Puts the submission in the admin verification queue as a pending `personal` verification (documents `ktp` and
      `selfie`) and sets the identity status to `pending`. Admins approve or reject it from the verification queue,
      which sets level 2. Writes an audit entry (`Ajukan verifikasi KTP`).
    tags: [Verification]
    x-access: session
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicKycIdentityRequest' }
    responses:
      '200':
        description: Updated status with identity `pending`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Kyc' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '409': { $ref: '#/components/responses/Conflict', description: 'already_submitted: identity is already verified, or a submission is under review.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: nik (exactly 16 digits), fullName (required), ktpFile (required), selfieFile (required).' }

/listings:
  get:
    operationId: listPublicListings
    summary: List the public listing catalog
    description: |
      Supply and demand listings that are public (status available, in_market, open or matched) from active users
      (restricted and suspended owners are hidden), plus demo listings derived from markets. Newest first. `q` matches
      item, code and owner name. Owner contact details are never exposed.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/PageSize' }
      - { $ref: '#/components/parameters/Q' }
      - { $ref: '#/components/parameters/Category' }
      - name: region
        in: query
        description: Substring match on the listing location (not exact, unlike other lists).
        schema: { type: string }
      - name: kind
        in: query
        schema: { type: string, enum: [supply, demand] }
      - name: market
        in: query
        description: Market id.
        schema: { type: string }
    responses:
      '200':
        description: A page of listings.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthPublicPublicListingPage' }

/listings/price-suggestion:
  get:
    operationId: getPriceSuggestion
    summary: Suggest a unit price for a listing
    description: |
      Quartiles (low 25%, median, high 75%, rounded to Rp 50) over the last 8 weekly medians of markets and the unit
      prices of catalog listings that share the category and unit. When `item` has words of 4+ letters, the samples are
      first narrowed to markets/listings whose name shares a word, falling back to the whole category when that leaves
      fewer than 3 data points. Returns `null` below 3 data points.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - { name: category, in: query, required: true, schema: { $ref: '#/components/schemas/CategoryId' } }
      - name: unit
        in: query
        required: true
        description: Compared case-insensitively.
        schema: { type: string }
      - name: item
        in: query
        description: Item name used to narrow the comparison set.
        schema: { type: string }
      - name: exclude
        in: query
        description: Listing id to leave out of the samples (the listing being edited).
        schema: { type: string }
    responses:
      '200':
        description: The suggestion, or `null` when there is not enough data.
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/AuthPublicPriceSuggestion' }
                - { type: 'null' }
    x-note: The mock does not validate that category and unit are present; a missing one simply matches nothing and yields `null`.
