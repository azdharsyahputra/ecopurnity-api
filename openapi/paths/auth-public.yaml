/search:
  get:
    operationId: search
    summary: Search the public economy
    description: |
      Case-insensitive substring match over title and subtitle of opportunities, markets, auctions, market makers
      (`business`) and auction lots (`product`, or `service` for the `it` and `logistics` categories). An empty `q`
      returns an empty list.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - name: q
        in: query
        schema: { type: string }
      - name: type
        in: query
