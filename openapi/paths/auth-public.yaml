# Auth, onboarding, public economy, search, explorer, matching, reputation, public profiles, KYC, catalog.
# Source: src/mocks/handlers.ts, profileHandlers.ts, kyc.ts, catalog.ts (the `/_mock/*` helpers are not part of the API).

/auth/me:
  get:
    operationId: getCurrentUser
    summary: Get the signed-in user
    description: Source of truth for the session. `401` means signed out; `403 account_suspended` means the account is suspended by governance.
    tags: [Auth]
    x-access: session
    responses:
      '200':
        description: The current user.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden', description: 'account_suspended: the account was suspended by the governance team.' }

/auth/login:
  post:
    operationId: login
    summary: Sign in with email and password
    description: |
      Sets the `ecp_session` cookie. The email is trimmed and lower-cased. Unknown email and wrong password return the
      same message so the response does not reveal which emails exist.
    tags: [Auth]
    x-access: public
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicLoginRequest' }
    responses:
      '200':
        description: Signed in.
        headers:
          Set-Cookie:
            description: The `ecp_session` httpOnly session cookie.
            schema: { type: string }
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      '401': { $ref: '#/components/responses/Unauthenticated', description: 'invalid_credentials: email or password is wrong (same message for both).' }
      '403': { $ref: '#/components/responses/Forbidden', description: 'account_suspended, or account_suspended_appealed when an appeal exists. The message mentions "Bandingmu sedang ditinjau." while the appeal is pending, or "Banding ditolak: <note>" when it was denied.' }
    x-note: The mock does not validate the body (a missing email would throw); the real API should answer 422 validation with fields email and password.

/auth/appeal:
  post:
    operationId: appealSuspension
    summary: Appeal an account suspension
    description: |
      Suspended accounts cannot sign in, so the credentials are re-checked here. Checks run in this order: credentials,
      account is suspended, no earlier appeal, reason length. Stores the appeal as `pending` for governance review.
    tags: [Auth]
    x-access: public
    x-audit: true
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicAppealRequest' }
    responses:
      '200':
        description: Appeal recorded.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthPublicOk' }
      '401': { $ref: '#/components/responses/Unauthenticated', description: 'invalid_credentials: email or password is wrong.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'not_suspended: the account is not suspended. already_appealed: an appeal was already submitted (one per account, even if denied).' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: reason (min 20 characters after trimming).' }

/auth/register:
  post:
    operationId: register
    summary: Create an account
    description: |
      Creates a participant account (no capabilities, no orgs, `onboarded: false`, `emailVerified: false`), derives the
      username from the email's local part, issues an email verification token and signs the user in
      (sets the `ecp_session` cookie).
    tags: [Auth]
    x-access: public
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicRegisterRequest' }
    responses:
      '201':
        description: Account created and signed in.
        headers:
          Set-Cookie:
            description: The `ecp_session` httpOnly session cookie.
            schema: { type: string }
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      '409': { $ref: '#/components/responses/Conflict', description: 'email_taken: fields.email "Email ini sudah punya akun. Masuk saja."' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: password (min 8 characters).' }
    x-note: The mock checks email uniqueness before password length, and does not validate name or email format; usernames are not made unique (two emails with the same local part share a username).

/auth/google:
  post:
    operationId: loginWithGoogle
    summary: Sign in or sign up with Google
    description: |
      Mock OAuth: the "provider" always returns the same Google account (`tamu.google@gmail.com`, email already verified).
      The account is created on first use, then the user is signed in (sets the `ecp_session` cookie). A real
      implementation exchanges an OAuth code and takes the identity from the provider.
    tags: [Auth]
    x-access: public
    security: []
    responses:
      '200':
        description: Signed in.
        headers:
          Set-Cookie:
            description: The `ecp_session` httpOnly session cookie.
            schema: { type: string }
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
    x-note: Takes no body in the mock and always answers 200, including when it creates the account (not 201).

/auth/logout:
  post:
    operationId: logout
    summary: Sign out
    description: Clears the session. Succeeds whether or not a session exists.
    tags: [Auth]
    x-access: public
    security: []
    responses:
      '204': { description: Signed out. }

/auth/verify-email:
  post:
    operationId: verifyEmail
    summary: Verify an email address with a token
    description: Marks the matching account's email verified and consumes the token. Does not need a session.
    tags: [Auth]
    x-access: public
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicVerifyEmailRequest' }
    responses:
      '200':
        description: Email verified.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      '400':
        description: 'invalid_token: the link is invalid or expired.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }

/auth/resend-verification:
  post:
    operationId: resendVerificationEmail
    summary: Resend the verification email
    description: Issues a new verification token for the signed-in user and emails it (replaces any earlier token).
    tags: [Auth]
    x-access: session
    responses:
      '204': { description: Email queued. }
      '401': { $ref: '#/components/responses/Unauthenticated' }

/auth/forgot-password:
  post:
    operationId: forgotPassword
    summary: Request a password reset email
    description: Always answers 204 so the response never reveals whether an email is registered. When the account exists a reset token is issued and emailed.
    tags: [Auth]
    x-access: public
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicForgotPasswordRequest' }
    responses:
      '204': { description: Accepted (whether or not the email is registered). }

/auth/reset-password:
  post:
    operationId: resetPassword
    summary: Set a new password with a reset token
    description: Consumes the token and replaces the password. Does not sign the user in. The token is checked before the password length.
    tags: [Auth]
    x-access: public
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicResetPasswordRequest' }
    responses:
      '204': { description: Password changed. }
      '400':
        description: 'invalid_token: the link is invalid or expired.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: password (min 8 characters). The token stays valid.' }

/me/onboarding:
  patch:
    operationId: completeOnboarding
    summary: Complete onboarding
    description: |
      Saves the onboarding answers and sets `onboarded: true`.
      - Sets the user's location and the identity preferences (location, categories, min price, max budget, delivery radius).
      - `firstListing` creates the user's first listing (supply: price = `minPriceIdr` or 0, status `available`; demand:
        budget = `maxBudgetIdr` or 0, status `open`, deadline in 30 days), category = the first chosen category (`agri` if none).
      - `organization` adds an unverified org membership with role `owner`.
      - `marketMakerApplication` with a non-blank `organization` files a Market Maker application (pending), writes an
        audit entry (`Ajukan Market Maker`) and notifies every admin (`transaction_update`, href `/admin/mm-applications`).
    tags: [Auth]
    x-access: session
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OnboardingInput' }
    responses:
      '200':
        description: The updated user.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
    x-audit: true
    x-note: The mock performs no validation of the onboarding body and does not guard against repeating onboarding (an organization membership is added again each time). The audit entry is only written when a Market Maker application is filed.

