/markets:
  get:
    operationId: listMarkets
    summary: List markets
    description: |
      Sorted by `volume30dIdr` descending (ties by id). `q` matches name, code and market maker name
      (case-insensitive substring). `region` is an exact, case-insensitive match. Draft markets are never listed. Items
      are the summary `Market` (no description, rules, price history, activity or auctions).
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/PageSize' }
      - { $ref: '#/components/parameters/Q' }
      - { $ref: '#/components/parameters/Category' }
      - { $ref: '#/components/parameters/Region' }
      - name: status
        in: query
        description: Comma-separated market statuses.
        schema: { type: string }
    responses:
      '200':
        description: A page of markets.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthPublicMarketPage' }

/markets/{id}:
  get:
    operationId: getMarket
    summary: Get a market
    description: |
      `rules` is the rule version governing the current round (the latest version whose `effectiveFromRound` is at most
      the highest started round; version 1 before any round started), rendered as labelled values in a fixed order
      (Eligibility, Visibilitas bid, Kenaikan/penurunan minimum, Kuantitas minimum, Kuantitas maksimum, Jendela mulai,
      Jendela selesai, Wilayah, Radius, Penetapan pemenang); empty when the market has no rule version.
      `priceHistory` is one point per week (`week` = Monday, YYYY-MM-DD) with deals over the last 12 weeks, oldest
      first; weeks without deals are absent. `activity` is the market's 6 newest activity events, newest first. Both
      come from analytics and are empty lists when it is unavailable. `auctions` are all rounds of the market, ordered
      like `GET /auctions` (live/extended, qualification, scheduled, the rest; then `endsAt` ascending), masked the
      same way. Draft markets answer 404.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    responses:
      '200':
        description: The market with rules, price history, activity and auctions.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketDetail' }
      '404': { $ref: '#/components/responses/NotFound' }

/markets/{id}/orders:
  post:
    operationId: createDirectMarketOrder
    summary: Place a direct order at a posted price
    description: |
      Buys a posted supply listing of a `direct_market` market at its listed unit price, on escrow terms with a 0.5%
      maker fee. Creates a transaction between the buyer (the caller) and the listing owner, and reduces the listing's
      remaining quantity; the listing becomes `sold` when it reaches zero (a history entry `Order langsung ...` is added
      to the owner's listing). The commitment value (quantity x unit price) is checked against the caller's KYC limit.
      Checks run in this order: session, account not restricted/suspended, market accepts direct orders, listing exists,
      not own listing, quantity, KYC limit.
    tags: [Public]
    x-access: session
    parameters:
      - { name: id, in: path, required: true, description: Market id., schema: { type: string } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicDirectOrderRequest' }
    responses:
      '201':
        description: Order placed.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthPublicDirectOrderResponse' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden', description: 'account_restricted: the account is restricted or suspended. kyc_limit: the order value exceeds the caller''s verification level limit.' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: the listing does not exist in this market or is not a supply listing.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'not_direct: the market is not a direct_market or is not active (also returned for an unknown market). own_listing: the listing belongs to the caller.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: quantity (must be > 0 and at most the listing''s remaining quantity).' }
    x-note: An unknown market id returns 409 not_direct rather than 404. Listings from the seeded market catalog (no owner userId) have their in-memory quantity decremented without a stored history.

