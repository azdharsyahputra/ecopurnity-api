/profiles/b/{slug}:
  get:
    operationId: getBusinessProfile
    summary: Get a public business profile
    description: |
      Business profile by slug (slugified name). Businesses come from market makers, user organizations, business
      accounts and verification submissions. Lists the markets the business operates and their non-cancelled auctions.
      Verified businesses show the documents NIB, NPWP and Akta pendirian.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    responses:
      '200':
        description: The profile.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessProfile' }
      '404': { $ref: '#/components/responses/NotFound' }

/me/kyc:
  get:
    operationId: getMyKyc
    summary: Get my verification level and limits
    description: Level 0 email (Rp 10 jt), 1 email + phone (Rp 100 jt), 2 KTP verified (Rp 2 M). The limit applies per commitment (bid, Dutch accept, buyer auction, accepted quote, direct order); exceeding it fails with `403 kyc_limit`.
    tags: [Verification]
    x-access: session
    responses:
      '200':
        description: Verification status.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Kyc' }
      '401': { $ref: '#/components/responses/Unauthenticated' }

/me/kyc/phone:
  post:
    operationId: requestPhoneOtp
    summary: Send a phone verification code
    description: |
      Sends a 6-digit code to the number (SMS/WhatsApp provider), valid for 5 minutes; a new request replaces the
      pending one. At most one request per 60 seconds. Only an HMAC of the code is stored. The frontend mock does not
      send anything and accepts only the fixed code `246810`.
    tags: [Verification]
    x-access: session
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicKycPhoneRequest' }
    responses:
      '200':
        description: 'Status with `otpPending: true`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Kyc' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: phone (Indonesian mobile number, 08... or 628..., 9 to 13 digits).' }
      '429':
        description: '`otp_cooldown`: a code was sent less than 60 seconds ago. `Retry-After` gives the seconds left.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }

/me/kyc/phone/verify:
  post:
    operationId: verifyPhoneOtp
    summary: Verify the phone code
    description: |
      Marks the phone verified (level 1) and stores the verified number. Checks run in this order: pending and
      unexpired OTP, then the code. 5 wrong codes burn the OTP.
    tags: [Verification]
    x-access: session
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicKycPhoneVerifyRequest' }
    responses:
      '200':
        description: Updated status.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Kyc' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '409': { $ref: '#/components/responses/Conflict', description: 'otp_expired: no pending OTP or it expired; request a new one.' }
      '422': { $ref: '#/components/responses/Validation', description: 'invalid_code with fields.code ("Kode salah. Sisa N percobaan."); the OTP stays pending.' }
      '429':
        description: '`too_many_attempts`: the 5th wrong code; the OTP is burned and a new one must be requested.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }

/me/kyc/identity:
  post:
    operationId: submitKtpVerification
    summary: Submit KTP and selfie for verification
    description: |
      Puts the submission in the admin verification queue as a pending `personal` verification (documents `ktp` and
      `selfie`) and sets the identity status to `pending`. Admins approve or reject it from the verification queue,
      which sets level 2. Writes an audit entry (`Ajukan verifikasi KTP`).

      The photos are uploaded first with `POST /uploads` (purposes `kyc_ktp` and `kyc_selfie`) and referenced here by
      upload id. The server checks that each upload belongs to the caller, has that purpose, exists in storage with the
      declared size, and is really an image (content sniffing). The NIK is stored encrypted, with a keyed hash for
      uniqueness; the admin form shows it masked.
    tags: [Verification]
    x-access: session
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthPublicKycIdentityRequest' }
    responses:
      '200':
        description: Updated status with identity `pending`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Kyc' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '409': { $ref: '#/components/responses/Conflict', description: 'already_submitted: identity is already verified, or a submission is under review. nik_in_use: another account is already verified with this NIK.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: nik (exactly 16 digits), fullName (required), ktpUploadId / selfieUploadId (missing, not yours, wrong purpose, not uploaded, or not an image).' }

/listings:
  get:
    operationId: listPublicListings
    summary: List the public listing catalog
    description: |
      Supply and demand listings that are public (status available, in_market, open or matched) from active users
      (restricted and suspended owners are hidden). Newest first. (The frontend mock also fabricates demo listings from
      markets; the API serves real listings only.) `q` matches
      item, code and owner name. Owner contact details are never exposed.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/PageSize' }
      - { $ref: '#/components/parameters/Q' }
      - { $ref: '#/components/parameters/Category' }
      - name: region
        in: query
        description: Substring match on the listing location (not exact, unlike other lists).
        schema: { type: string }
      - name: kind
        in: query
        schema: { type: string, enum: [supply, demand] }
      - name: market
        in: query
        description: Market id.
        schema: { type: string }
    responses:
      '200':
        description: A page of listings.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthPublicPublicListingPage' }

/listings/price-suggestion:
  get:
    operationId: getPriceSuggestion
    summary: Suggest a unit price for a listing
    description: |
      Quartiles (low 25%, median, high 75%, rounded to Rp 50) over the last 8 weekly medians of markets and the unit
      prices of catalog listings that share the category and unit. When `item` has words of 4+ letters, the samples are
      first narrowed to markets/listings whose name shares a word, falling back to the whole category when that leaves
      fewer than 3 data points. Returns `null` below 3 data points.
    tags: [Public]
    x-access: public
    security: []
    parameters:
      - { name: category, in: query, required: true, schema: { $ref: '#/components/schemas/CategoryId' } }
      - name: unit
        in: query
        required: true
        description: Compared case-insensitively.
        schema: { type: string }
      - name: item
        in: query
        description: Item name used to narrow the comparison set.
        schema: { type: string }
      - name: exclude
        in: query
        description: Listing id to leave out of the samples (the listing being edited).
        schema: { type: string }
    responses:
      '200':
        description: The suggestion, or `null` when there is not enough data.
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/AuthPublicPriceSuggestion' }
                - { type: 'null' }
    x-note: The mock does not validate that category and unit are present; a missing one simply matches nothing and yields `null`.

/uploads:
  post:
    operationId: createUpload
    summary: Get a presigned URL to upload a file
    description: |
      Files never pass through the API. The client asks for an upload slot, PUTs the file straight to object storage
      (S3-compatible; Cloudflare R2 in production) with the returned URL and headers, then passes `uploadId` to the
      endpoint that uses the file, which verifies it. The URL expires after 10 minutes. `sizeBytes` is part of the
      signature, so storage rejects a different size. Allowed types and size per purpose:
      - `kyc_ktp`, `kyc_selfie`: image/jpeg, image/png, image/webp; up to 8 MB.
      The bucket is private; files are read back through short-lived presigned GET URLs (admin review).
    tags: [Uploads]
    x-access: session
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UploadRequest' }
    responses:
      '201':
        description: Upload slot created.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadTicket' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: contentType (not allowed for the purpose), sizeBytes (empty or over the limit), fileName (required).' }
      '503':
        description: '`storage_unavailable`: object storage is not configured.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }
