      - { $ref: '#/components/parameters/PageSize' }
      - { $ref: '#/components/parameters/Q' }
      - { $ref: '#/components/parameters/Category' }
      - name: region
        in: query
        description: Accepted but has no effect on auctions (auctions carry no region).
        schema: { type: string }
      - name: status
        in: query
        description: Comma-separated auction statuses.
        schema: { type: string }
    responses:
      '200':
        description: A page of auctions (without rules, extension settings or bids).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthPublicAuctionPage' }
    x-note: The mock fills the region filter from the query itself, so `region` never filters anything.

