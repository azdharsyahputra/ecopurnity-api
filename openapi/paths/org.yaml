/orgs/{orgId}/auctions/{aid}/award:
  parameters:
    - *a1
    - name: aid
      in: path
      required: true
      description: Business auction id.
      schema:
        type: string
  post:
    tags:
      - Organization
    operationId: awardOrgAuction
    summary: Award an auction
    description: "Records the winners per lot, marks every lot auction `awarded` (winning bids `won`, the rest `lost`, bidders notified) and the linked procurement request `awarded`. Allowed only after all lot auctions are `closed` and no award exists yet. `lines` has one array per lot (same order as `lots`), each with at least one allocation. Every allocation must name an offer of that lot (`offerId` from the evaluation), once, with quantity > 0; a lot's allocations may not exceed its quantity. Price and supplier name are taken from the offer, not the body. The `reason` is stored on the award and as the audit `reason`; the audit entry lists the allocation per lot. Issuing the PO is a separate step."
    x-access: org:auctions.manage
    x-audit: true
    x-note: "Check order: 404, awarded, not_closed, reason, lines."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgAwardInput"
    responses:
      "200":
        description: Awarded auction.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgAuctionView"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks auctions.manage."
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: auction does not exist."
      "409":
        $ref: "#/components/responses/Conflict"
        description: "awarded: a winner was already set. not_closed: not all lots are closed (also when the auction has no live lots yet, e.g. pending approval)."
      "422":
        $ref: "#/components/responses/Validation"
        description: 'fields: reason (required); lines (one array per lot), lines.{lot} ("Setiap lot harus punya pemenang", allocations exceed the lot quantity), lines.{lot}.{index} (unknown offer, offer chosen twice, quantity <= 0).'
