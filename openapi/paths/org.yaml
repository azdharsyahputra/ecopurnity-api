      in: path
      required: true
      description: Transaction id.
      schema:
        type: string
  get:
    tags:
      - Organization
    operationId: getOrgTransaction
    summary: Get an organization transaction
    description: "Full trade detail (terms, agreement, invoice, shipments, QC, dispute with evidence, reviews, timeline, documents) plus the team `activity` for it and, for a sub-PO created by collective pool settlement (`group.id` is the pool), `collective`: the pool's pro-rata split with the pool id, title and unit (masked as in `GET /orgs/{orgId}/collective`, own line carries `transactionId`)."
    x-access: org:member
    responses:
      "200":
        description: Transaction.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgTransactionPage"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization, or the role lacks transactions.view."
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: transaction does not exist in this org."
/orgs/{orgId}/transactions/{tid}/actions:
  parameters:
    - *a1
    - name: tid
      in: path
      required: true
      description: Transaction id.
      schema:
        type: string
  post:
    tags:
      - Organization
    operationId: actOnOrgTransaction
    summary: Take a step on an organization trade
    description: |-
      Shared F6 trade action endpoint (same body and rules as the personal `POST /me/transactions/{id}/actions`), taken by the organization on its side of the trade (`role` of the transaction: buyer for procurement POs, supplier for selling auctions).

      Role gate (PRD 9.8): money moves by Finance, goods by Operations, commitments by Procurement/Sales. Built-in roles follow this table; a custom role may take any action when it has transactions.manage.

      | Action | Roles that may take it |
      |---|---|
      | accept_agreement | owner, procurement, sales |
      | issue_invoice | owner, finance, sales |
      | pay | owner, finance |
      | ship | owner, operations |
      | upload_proof | owner, operations |
      | confirm_receipt | owner, procurement, operations |
      | cancel | owner, procurement |
      | dispute | owner, procurement |
      | add_evidence | owner, procurement, operations |
      | review | owner, procurement |

      The role gate runs before the state machine. Then the action must be available for the org's side in the current status, otherwise `409 invalid_transition`. Per action: `ship` needs `shipment` (quantity > 0 and <= unscheduled quantity, `dropPoint`), `upload_proof` needs `file`, `confirm_receipt` takes `qc` (outcome `partial` needs `acceptedQty` between 1 and quantity-1, any non-`accepted` outcome needs a `note`; `rejected` opens a dispute), `dispute` and `add_evidence` need `note`, `review` needs `review.rating` 1-5.

      Side effects: the action is written as an audit entry on the org (with a status change diff; it is the page's `activity`); the transaction timeline, documents and ledger are updated as for personal trades. The counterparty is notified (type `payment`, `delivery` or `transaction_update`): a user directly, an org through its active members whose role may see transactions (href `/org/{orgId}/transactions/{id}`); both sides get `trade.updated`. External counterparties are played by a bot (agreement, invoice, payment, shipment, delivery proof, receipt, review, about 8 s after each change) only when the server runs with `SIMULATE_COUNTERPARTIES` (demo).
    x-access: org:transactions.manage
    x-audit: true
    x-note: "`x-access` shows the custom-role fallback; built-in roles are gated by the per-action table in the description. A missing or unknown `action` is 422 (schema validation)."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TradeActionInput"
    responses:
      "200":
        description: Updated transaction page.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgTransactionPage"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: 'forbidden: the caller is not a member of this organization. Also forbidden: the role may not take this action: "{action label} hanya untuk {roles}; peranmu {role}", or for custom roles "Peran {role} tidak punya izin kelola Transactions".'
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: transaction does not exist."
      "409":
        $ref: "#/components/responses/Conflict"
        description: "invalid_transition: action not available in the current status for the org's side."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields per action: quantity, dropPoint (ship), file (upload_proof), acceptedQty and note (confirm_receipt QC), note (dispute, add_evidence), rating (review)."
/orgs/{orgId}/analytics:
  parameters:
    - *a1
  get:
    tags:
      - Organization
    operationId: getOrgAnalytics
    summary: Get purchase analytics
    description: "Procurement analytics (PRD 9.9) over the latest `months` months that have data: spend per month per category, savings (paid vs budget vs market), unit prices vs market, price trend and demand of the biggest item, supplier scorecard, auction results and purchase history. Source: ClickHouse (`org_purchase_monthly`, `trades`, `auction_results`: every trade the org buys in, counted at agreement, plus imported purchase history). When ClickHouse is unavailable the same figures are computed from Postgres (purchase history plus the trades of awarded org auctions), so the endpoint never fails because of analytics."
    x-access: org:member
    x-note: Budget and market reference of awarded auctions are both the lot target price (no market reference on awards yet). `months` counts months with data, not calendar months (at most 36).
    parameters:
      - name: months
        in: query
        description: Number of months to include, most recent first.
        schema:
          type: integer
          minimum: 1
          maximum: 36
          default: 12
      - name: category
        in: query
        description: Restrict to one category.
        schema:
          $ref: "#/components/schemas/CategoryId"
    responses:
      "200":
        description: Analytics.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgAnalytics"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
