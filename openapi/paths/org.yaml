    operationId: createOrgAuction
    summary: Create a business auction
    description: |-
      Creates the auction (code `OAU-xxxx`, lots get ids `lot-1..n`, `multiLot` is derived from the lot count, `valueIdr` = sum of quantity x reserve price). Required approvers come from the approval rules for `valueIdr` (rules with `appliesTo` containing `auction`).

      - With approvers: status `pending_approval`; pending approvers are notified (type `transaction_update`, href `/org/{orgId}/auctions?review={id}`). It goes live only after every required role approves (`POST .../auctions/{aid}/actions`).
      - Without approvers: it opens immediately: one realtime auction is created per lot (published as public auctions `oau-...`, owned by the org owner) and status becomes `scheduled` or `live`. Lots whose start time has passed start on a 5 s timer.
