    summary: Get purchase analytics
    description: "Procurement analytics (PRD 9.9) over the latest `months` months that have data: spend per month per category, savings (paid vs budget vs market), unit prices vs market, price trend and demand of the biggest item, supplier scorecard, auction results and purchase history. Source: seeded purchase history plus every awarded procurement auction."
