        application/json:
          schema:
            $ref: "#/components/schemas/OrgAuctionDecisionInput"
    responses:
      "200":
        description: Updated auction.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgAuctionView"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: this approval is not waiting for the caller's role (`Approval ini tidak menunggu peran {role}`)."
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: auction does not exist."
      "409":
        $ref: "#/components/responses/Conflict"
        description: "invalid_action: the auction is not waiting for approval."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: note (reject requires a reason)."
/orgs/{orgId}/auctions/{aid}/evaluation:
  parameters:
    - *a1
