    description: Records the winners per lot, marks every lot auction `awarded` and the linked procurement request `awarded`. Allowed only after all lot auctions are `closed` and no award exists yet. `lines` has one array per lot (same order as `lots`), each with at least one allocation of quantity > 0. The `reason` is stored on the award and as the audit `reason`; the audit entry lists the allocation per lot. Issuing the PO is a separate step.
