/orgs/{orgId}:
  parameters:
    - &a1
      $ref: "#/components/parameters/OrgId"
  get:
    tags:
      - Organization
    operationId: getOrgSettings
    summary: Get organization settings
    description: Profile, roles, permission matrix, departments and approval rules of the organization. Used by the frontend to render role-aware controls.
    x-access: org:member
    x-note: "Session and active membership of the organization in the URL are checked first (401 / 403; an unknown org is also 403). Read endpoints need no `<resource>.view` permission: any active member can read. Write permissions come from the member's role row (`org_roles.permissions`); the owner role always has every permission."
    responses:
      "200":
        description: Organization settings.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgSettings"
      "401": &a2
        $ref: "#/components/responses/Unauthenticated"
        description: "unauthenticated: no session."
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
/orgs/{orgId}/overview:
  parameters:
    - *a1
  get:
    tags:
      - Organization
    operationId: getOrgOverview
    summary: Get organization overview
    description: "Dashboard (PRD 9.1): month stats, approvals waiting for the caller's role (procurement and auctions in `pending_approval` where the caller's role is a still-pending required approver), procurement pipeline counts and the 12 latest audit entries. Spend and savings are computed from purchase history plus awarded procurement auctions of the current month."
    x-access: org:member
    responses:
      "200":
        description: Overview.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgOverview"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
/orgs/{orgId}/profile:
  parameters:
    - *a1
  put:
    tags:
      - Organization
    operationId: updateOrgProfile
    summary: Update business profile
    description: Replaces the profile. `documents` and `verification` in the body are ignored (kept from the stored profile). `legal.npwp` and `legal.nib` are only validated when non-empty. The audit entry lists the changed fields (name, industry, location, NIB, NPWP, akta, description, categories, hours).
    x-access: org:profile.manage
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgProfile"
    responses:
      "200":
        description: Saved profile.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgProfile"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks profile.manage."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: name (required, unique across organizations), npwp (format `00.000.000.0-000.000`), nib (13 digits), hours (days 0-6, `from` before `to`, HH:MM)."
/orgs/{orgId}/profile/documents:
  parameters:
    - *a1
  post:
    tags:
      - Organization
    operationId: uploadOrgDocument
    summary: Attach a verification document
    description: "Attaches a file uploaded with `POST /uploads` (purpose `org_document`: PDF or image, up to 10 MB). The upload must belong to the caller, be complete (size and sniffed type match) and not used before; the document takes the upload's file name. A document of the same `kind` replaces the previous one, except `other`, which accumulates."
    x-access: org:profile.manage
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgProfileDocumentInput"
    responses:
      "200":
        description: Profile with updated documents.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgProfile"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks profile.manage."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: uploadId (unknown, someone else's, other purpose, already used, not uploaded yet, size or content mismatch)."
      "503":
        description: "`storage_unavailable`: object storage is not configured."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
/orgs/{orgId}/profile/verification:
  parameters:
    - *a1
  post:
    tags:
      - Organization
    operationId: requestOrgVerification
    summary: Request business verification
    description: "Moves `verification` to `pending` and opens a business verification request in the admin queue (`verification_requests`, kind `business`) with the profile as its form (Nama badan usaha, NIB, NPWP, Alamat, Penanggung jawab, Bidang usaha) and the nib/npwp/akta documents. Admins get an in-app notification. Requires one document each of kind nib, npwp and akta. Allowed from `unverified` and `rejected` only. No request body."
    x-access: org:profile.manage
    x-audit: true
    responses:
      "200":
        description: "Profile with `verification: pending`."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgProfile"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks profile.manage."
      "422":
        $ref: "#/components/responses/Validation"
        description: 'validation without `fields`: message lists missing documents, e.g. "Dokumen belum lengkap: NIB, AKTA".'
      "409":
        $ref: "#/components/responses/Conflict"
        description: "already_submitted: a review is already pending. verified: the business is already verified."
/orgs/{orgId}/team:
  parameters:
    - *a1
  get:
    tags:
      - Organization
    operationId: getOrgTeam
    summary: Get team
    description: Settings (profile, roles, permissions, departments, approval rules) plus the member list. Member `userId` is never exposed.
    x-access: org:member
    responses:
      "200":
        description: Team data.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamData"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
/orgs/{orgId}/team/invite:
  parameters:
    - *a1
  post:
    tags:
      - Organization
    operationId: inviteOrgMember
    summary: Invite a team member
    description: "Adds a member with `status: invited` and `name` set to the email. If an account with that email already exists the invitee gets an in-app notification (type `transaction_update`, href `/app?invitation={memberId}`); otherwise they see it after registering with that email (`GET /me/invitations`). Either way an invitation email is sent to the address. Validation order: email, duplicate, role."
    x-access: org:team.manage
    x-audit: true
    x-note: The notification type is `transaction_update` (no dedicated invitation type). `department` is free text.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgInviteInput"
    responses:
      "204":
        description: Invited.
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks team.manage."
      "409":
        $ref: "#/components/responses/Conflict"
        description: "exists: email is already a member (`fields.email`)."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: email (valid email required), role (must be one of the org roles)."
/orgs/{orgId}/team/members/{memberId}:
  parameters:
    - *a1
    - name: memberId
      in: path
      required: true
      description: Team member id (`OrgMember.id`).
      schema:
        type: string
  patch:
    tags:
      - Organization
    operationId: updateOrgMember
    summary: Change member role or department
    description: Partial update of `role` and `department`. The new `role` must be one of the org roles. Demoting an owner is allowed only while another active owner remains. The audit entry lists role and department changes.
    x-access: org:team.manage
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgMemberPatch"
    responses:
      "204":
        description: Updated.
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks team.manage."
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: member does not exist."
      "409":
        $ref: "#/components/responses/Conflict"
        description: "last_owner: the only active owner cannot be changed to another role (`fields.role`)."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: role (not a role of this organization)."
  delete:
    tags:
      - Organization
    operationId: removeOrgMember
    summary: Remove a team member
    x-access: org:team.manage
    x-audit: true
    x-note: The self-removal check compares the member's account with the caller; invited members without an account can always be removed. The last active owner cannot be removed.
    responses:
      "204":
        description: Removed.
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks team.manage."
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: member does not exist."
      "409":
        $ref: "#/components/responses/Conflict"
        description: "self: caller cannot remove themselves. last_owner: the only owner cannot be removed."
/orgs/{orgId}/team/settings:
  parameters:
    - *a1
  put:
    tags:
      - Organization
    operationId: updateOrgTeamSettings
    summary: Save roles, permissions, departments and approval rules
    description: "Replaces the four settings blocks wholesale. `roles` must keep the five built-in roles (owner, procurement, finance, operations, sales; labels may change); custom roles have ids `custom-...` and can be added or removed (not while a member holds one). `permissions` keys must be roles of the body; the owner row is ignored (owner always has everything). Approval rules decide `requiredApprovers` for new procurement requests and auctions: every rule whose `appliesTo` includes the subject and whose `minAmountIdr` is strictly below the value contributes its approver roles (deduplicated, in rule order); approvers must be roles of the body. Rule ids are reassigned on save. Already-created requests keep the approvers they were created with (procurement is re-evaluated on `submit`). The audit entry lists which blocks changed."
    x-access: org:team.manage
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgTeamSettingsInput"
    responses:
      "200":
        description: Full settings after the update.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgSettings"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks team.manage."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: rule-{index} (label required / minAmountIdr must be a number >= 0 / at least one approver / approver is not a role / appliesTo empty), roles (role label must not be empty, built-in role missing, invalid custom id, duplicate id, role still held by a member), permissions (unknown role, module or action)."
/orgs/{orgId}/inventory:
  parameters:
    - *a1
  get:
    tags:
      - Organization
    operationId: getOrgInventory
    summary: Get inventory
    description: Items, warehouses, production capacity, logistics and recurring supply schedules.
    x-access: org:member
    responses:
      "200":
        description: Inventory.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryData"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
/orgs/{orgId}/inventory/items:
  parameters:
    - *a1
  post:
    tags:
      - Organization
    operationId: addOrgInventoryItem
    summary: Add an inventory item
    description: The new item is added at the top of the list with a generated id. `sku`, `warehouse`, `moq`, `leadTimeDays` and `qualitySpec` are optional.
    x-access: org:inventory.create
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgInventoryItemInput"
    responses:
      "201":
        description: Created (no body).
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks inventory.create."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: name (required), quantity (`quantity.value` must be a number >= 0, unit required), moq / leadTimeDays (>= 0)."
/orgs/{orgId}/inventory/import:
  parameters:
    - *a1
  post:
    tags:
      - Organization
    operationId: importOrgInventory
    summary: Bulk import inventory items
    description: "The client parses the CSV; the server re-validates every row (name required, category a known CategoryId, quantity a number >= 0, moq and leadTimeDays >= 0) and rejects the whole batch on the first error (row numbers count the CSV header as row 1). Rows are stored normalised as the CSV import does: blank `sku` becomes `SKU-{n}`, blank `warehouse` `Gudang utama`, blank unit `unit`. On success all items are added at the top with generated ids. An empty `items` array succeeds with `imported: 0`. At most 5000 rows per import."
    x-access: org:inventory.create
    x-audit: true
    x-note: Only the first error is returned and without `fields`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgInventoryImportInput"
    responses:
      "200":
        description: Import result.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgInventoryImportResult"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks inventory.create."
      "422":
        $ref: "#/components/responses/Validation"
        description: 'validation without `fields`: message is the first row error, e.g. "Baris 3: kategori \"x\" tidak dikenal", "Baris 2: nama kosong" or "Baris 4: jumlah bukan angka".'
/orgs/{orgId}/inventory/schedules:
  parameters:
    - *a1
  post:
    tags:
      - Organization
    operationId: addOrgSupplySchedule
    summary: Add a recurring supply schedule
    description: "`every` defaults to `monthly`, `direction` to `in`, `nextAt` to now."
    x-access: org:inventory.manage
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgInventoryScheduleInput"
    responses:
      "201":
        description: Created (no body).
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks inventory.manage."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: item (required), quantity (`quantity.value` must be > 0)."
/orgs/{orgId}/procurement:
  parameters:
    - *a1
  get:
    tags:
      - Organization
    operationId: listOrgProcurement
    summary: List procurement requests
    description: All requests of the organization, newest `updatedAt` first. Not paginated or filtered.
    x-access: org:member
    responses:
      "200":
        description: Requests.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ProcurementRequest"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
  post:
    tags:
      - Organization
    operationId: createOrgProcurement
    summary: Create a procurement request
    description: 'Creates the request with code `PRQ-xxxx`, `requiredApprovers` from the approval rules for the budget (rules with `appliesTo` containing `procurement` and `minAmountIdr` strictly below `budgetIdr`), and `approvals: []`. With `submit: false` the status is `draft`. With `submit: true` the status is `approved` when no approver is required, otherwise `pending_approval`; in that case every member whose role is a pending approver (except the caller) gets an in-app notification "Perlu approval kamu: {code}" (type `transaction_update`, href `/org/{orgId}/procurement/{id}`).'
    x-access: org:procurement.create
    x-audit: true
    x-note: "`spec` and `deliveryLocation` are free text."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgProcurementCreateInput"
    responses:
      "201":
        description: Created request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementRequest"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks procurement.create."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: need (required), quantity (`quantity.value` > 0, unit required), budgetIdr (> 0), deadline (required, must be in the future), invited (`visibility: invite` needs at least one `invitedSupplierIds`; every id must be a directory supplier)."
/orgs/{orgId}/procurement/{id}:
  parameters:
    - *a1
    - name: id
      in: path
      required: true
      description: Procurement request id.
      schema:
        type: string
  get:
    tags:
      - Organization
    operationId: getOrgProcurement
    summary: Get a procurement request
    description: The request, audit entries for it (and for its auction), and the collective pool it joined, if any (masked per member as in `GET /orgs/{orgId}/collective`).
    x-access: org:member
    responses:
      "200":
        description: Request detail.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgProcurementDetail"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: request does not exist in this org."
/orgs/{orgId}/procurement/{id}/actions:
  parameters:
    - *a1
    - name: id
      in: path
      required: true
      description: Procurement request id.
      schema:
        type: string
  post:
    tags:
      - Organization
    operationId: actOnOrgProcurement
    summary: Take a workflow action on a procurement request
    description: |-
      One endpoint for the request workflow. The action must be in the set currently available to the caller's role (`procurementActions`), otherwise `409 invalid_action` (also used when the role lacks permission: no 403).

      | Action | Available when | Role needs | Effect |
      |---|---|---|---|
      | submit | status `draft` | procurement.manage or procurement.create | Recomputes `requiredApprovers` from the approval rules, status becomes `approved` (no approver needed) or `pending_approval` (approvers notified as in create). |
      | approve | `pending_approval` | caller's role is a still-pending required approver | Records an approval; status becomes `approved` when every required role has approved. |
      | reject | `pending_approval` | same as approve | Requires `note`. A single rejection sets status `rejected`. |
      | publish | `approved` | procurement.manage or procurement.create | Status `published`. |
      | collective | `approved` or `published` | collective.create | Joins (or creates) the open collective pool with the same category and unit; status `in_collective`, `poolId` set, `visibility` forced to `aggregate`. |
      | cancel | `draft`, `pending_approval`, `approved`, `published` | procurement.manage or procurement.create | Status `cancelled`. |

      Collective: pool quantity is `quantity` (defaults to the request quantity) and `optIn` (default false) controls whether the business name is shown to other pool members. When no open matching pool exists a new one is created from the request (base price = budget / quantity, `refQty` = request quantity, `thresholdQty` = 8 x request quantity, region from the last part of the org location, default "Jawa Barat").
    x-access: org:member
    x-audit: true
    x-note: 'Permission failures surface as 409 `invalid_action`, not 403. Approvers are notified once, when the request is submitted (every pending approver role). Audit labels: Ajukan procurement, Publish procurement, Batalkan procurement, Gabungkan ke collective; approve/reject write "Approve procurement" / "Tolak procurement" (reject carries `reason`).'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgProcurementActionInput"
    responses:
      "200":
        description: Updated request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementRequest"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: request does not exist."
      "409":
        $ref: "#/components/responses/Conflict"
        description: "invalid_action: the action is not available for this status or role."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: note (reject requires a reason), quantity (collective: must be > 0)."
/orgs/{orgId}/collective:
  parameters:
    - *a1
  get:
    tags:
      - Organization
    operationId: listOrgPools
    summary: List collective procurement pools
    description: |-
      All pools on the platform (shared across organizations), each as this organization sees it, plus `match` (the pool category is one of the org's categories). Not paginated.

      Masking: members of other businesses show `name: "Bisnis lain #n"` unless they opted in; the caller's own member row has `mine: true` and its real name. The internal market maker user is never exposed. `round` mirrors the pool's live market auction (`status`, `endsAt`) once the market maker opened it.

      Settlement (PRD F6): once the round closes, `settlement` carries the winner, clearing `priceIdr` and one line per member with `quantity`, pro-rata `share`, `amountIdr`; `transactionId` (the sub-PO the member's org received on the F6 trade model, see `GET /orgs/{orgId}/transactions/{tid}`) is present only on the caller's own line. Other lines are masked like members.
    x-access: org:member
    responses:
      "200":
        description: Pools.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PoolView"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
  post:
    tags:
      - Organization
    operationId: createOrgPool
    summary: Create a collective pool
    description: Creates an `open` pool and joins the caller's org with `quantity`. `refQty` = quantity and `thresholdQty` = 8 x quantity. `region` defaults to the last part of the org location.
    x-access: org:collective.create
    x-audit: true
    x-note: Audit entry type is `procurement`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgPoolCreateInput"
    responses:
      "201":
        description: Created pool.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectivePool"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks collective.create."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: title (required), categoryId (required), unit (required), deadline (required, in the future), quantity (> 0), baseUnitPriceIdr (> 0)."
/orgs/{orgId}/collective/{poolId}/join:
  parameters:
    - *a1
    - name: poolId
      in: path
      required: true
      description: Pool id.
      schema:
        type: string
  post:
    tags:
      - Organization
    operationId: joinOrgPool
    summary: Join a pool or change demand
    description: Adds the caller's org to the pool, or updates its `quantity` and `optIn` if it is already a member.
    x-access: org:collective.create
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgPoolJoinInput"
    responses:
      "200":
        description: Pool as this org sees it.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectivePool"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks collective.create."
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: pool does not exist."
      "409":
        $ref: "#/components/responses/Conflict"
        description: "closed: the pool is no longer `open` (a market was requested or formed)."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: quantity (> 0)."
/orgs/{orgId}/collective/{poolId}/leave:
  parameters:
    - *a1
    - name: poolId
      in: path
      required: true
      description: Pool id.
      schema:
        type: string
  post:
    tags:
      - Organization
    operationId: leaveOrgPool
    summary: Leave a pool
    description: Removes the caller's org from the pool. Any of the org's procurement requests `in_collective` on that pool go back to `approved` with `poolId` cleared.
    x-access: org:collective.create
    x-audit: true
    x-note: "The `visibility: aggregate` set when the request joined is not reverted."
    responses:
      "204":
        description: Left.
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks collective.create."
      "404":
        $ref: "#/components/responses/NotFound"
        description: "not_found: pool does not exist."
      "409":
        $ref: "#/components/responses/Conflict"
        description: "closed: the pool is no longer `open`. not_member: the org is not in the pool."
/orgs/{orgId}/collective/{poolId}/market:
