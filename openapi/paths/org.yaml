    operationId: requestOrgPoolMarket
    summary: Ask a market maker to form a market for the pool
    description: Allowed once the combined demand reaches `thresholdQty` and the caller's org is a member. Sets status `market_requested` and `marketRequestedAt`. A market maker then forms the market and opens the round (`marketId`, `auctionId`, status `market_live`); after the round the pool becomes `settled` with `settlement` filled (see `GET /orgs/{orgId}/collective`). Those steps are market maker endpoints outside this file.
    x-access: org:collective.manage
    x-audit: true
    x-note: "There is no status guard: a pool already `market_requested`, `market_live` or `settled` can be requested again and is reset to `market_requested` with a new `marketRequestedAt`. Audit entry type is `market`."
    responses:
      "200":
        description: "Pool with `status: market_requested`."
