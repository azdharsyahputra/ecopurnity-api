      description: Business auction id (`OrgAuction.id`).
      schema:
        type: string
  post:
    tags:
      - Organization
    operationId: decideOrgAuction
    summary: Approve or reject an auction
    description: Records the caller's approval for the role it holds. Allowed only while the auction is `pending_approval` and the caller's role is still a pending required approver (the org's approval rules, not the `auctions.approve` permission). When every required role has approved the auction opens as in create (lots go live, status `scheduled` or `live`). One rejection sets status `rejected` and returns a linked procurement request (`in_auction`) to `approved`. A rejection requires `note`, which is stored on the approval and as the audit `reason`.
    x-access: org:member
    x-audit: true
    x-note: Approvers are notified once, at creation. Audit labels "Approve auction" / "Tolak auction".
    requestBody:
      required: true
