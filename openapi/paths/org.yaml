    x-access: org:suppliers.manage
    x-audit: true
    x-note: "`x-access` is suppliers.create for shortlist/invite. A blocked supplier rejects every action except unblock (including rate). `unblock` resets any relation to `none`, even for a supplier that was not blocked. An unrecognised `action` needs suppliers.manage and does not change the relation. Audit entry carries `reason` for block."
