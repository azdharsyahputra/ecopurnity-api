    description: "Changes this org's relation to the supplier: shortlist -> `shortlisted`, invite -> `invited`, verify -> `verified`, block -> `blocked`, unblock -> `none`; rate stores `myRating` (1-5) and leaves the relation. Permission: `shortlist` and `invite` need suppliers.create, every other action needs suppliers.manage. Checks run in this order: supplier exists, permission, validation (block reason, rating), verify prerequisites, blocked state."
    x-access: org:suppliers.manage
    x-audit: true
    x-note: "`x-access` is suppliers.create for shortlist/invite. A blocked supplier rejects every action except unblock (including rate). Audit entry carries `reason` for block."
