      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrgAuctionInput"
    responses:
      "201":
        description: Created auction.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgAuctionView"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks auctions.create."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: title (required), lots (at least one lot, at most 20), lot-{index} (item, quantity.value > 0, unit and reservePriceIdr > 0 required), duration (`schedule.durationMinutes` between 1 and 43200), startsAt (more than 60 s in the past), minStepIdr (>= 0), weights (>= 0), minRating (0-5), type (`dutch` is not offered for business auctions yet: accepting a Dutch ask needs a market maker as seller), invited (unknown supplier id), procurementId (not an approved or published request of this org)."
/orgs/{orgId}/auctions/{aid}/actions:
  parameters:
    - *a1
