/orgs/{orgId}/auctions:
  parameters:
    - *a1
  get:
    tags:
      - Organization
    operationId: listOrgAuctions
    summary: List organization auctions
    description: "All business auctions, newest first. `status` is derived from the lots' live status: `live` while any lot runs, `scheduled` before start, `closed` when all are done, `awarded` after award; `pending_approval` and `rejected` are stored. `live[]` has one entry per lot (index-aligned with `lots`) with realtime facts; `bestPriceIdr` is hidden (absent) on sealed auctions while live."
    x-access: org:member
    responses:
      "200":
        description: Auctions.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/OrgAuctionView"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization."
  post:
    tags:
      - Organization
    operationId: createOrgAuction
    summary: Create a business auction
    description: |-
      Creates the auction (code `OAU-xxxx`, lots get ids `lot-1..n`, `multiLot` is derived from the lot count, `valueIdr` = sum of quantity x reserve price). Required approvers come from the approval rules for `valueIdr` (rules with `appliesTo` containing `auction`).

      - With approvers: status `pending_approval`; pending approvers are notified (type `transaction_update`, href `/org/{orgId}/auctions?review={id}`). It goes live only after every required role approves (`POST .../auctions/{aid}/actions`).
      - Without approvers: it opens immediately: each lot runs as one economy auction (`GET /auctions/{id}`, code `AUC-...`, owned by the organization: members cannot bid and evaluate it here; no market, so no maker fee) and status becomes `scheduled` or `live`. Bidding, anti-sniping and the auction clock are the economy ones. Sealed auctions run with sealed visibility.
      - `procurementId` must point to a request of this org in status `approved` or `published`; that request becomes `in_auction` immediately (even while the auction waits for approval).
