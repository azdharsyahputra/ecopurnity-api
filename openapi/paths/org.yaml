        type: string
  get:
    tags:
      - Organization
    operationId: getOrgAuctionEvaluation
    summary: Evaluate offers per lot
    description: "For each lot: its live status and one offer per bidder (their best active bid: lowest when buying, highest for forward/Dutch selling auctions; hidden bids included, the org owns the auction), sorted best price first. `id` is the bid id (use it as `offerId` in the award). A bidder whose party is in the supplier directory gets that `supplierId` and its latest scorecard (quality, delivery, reliability; reputation = the scorecard average); other bidders get their party id as `supplierId` and an 80 baseline. `capacity` is the whole lot (bids carry no capacity yet). Used by the award simulation (weights, award rule, split)."
    x-access: org:member
    responses:
      "200":
        description: Evaluation.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgAuctionEvaluation"
      "401": *a2
