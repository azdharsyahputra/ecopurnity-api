    x-access: org:member
    x-note: The handler strips only the listed detail fields, so remaining optional fields (`agreement`, `invoice`, `qc`, `group`, `makerFeeRate`, `supplierId`) are present when set.
    responses:
      "200":
        description: Transactions.
