          application/json:
            schema:
              $ref: "#/components/schemas/OrgAuctionView"
      "401": *a2
      "403":
        $ref: "#/components/responses/Forbidden"
        description: "forbidden: the caller is not a member of this organization. Also forbidden: role lacks auctions.create."
      "422":
        $ref: "#/components/responses/Validation"
        description: "fields: title (required), lots (at least one lot), lot-{index} (item, quantity.value > 0 and reservePriceIdr > 0 required), duration (`schedule.durationMinutes` > 0), startsAt (more than 60 s in the past)."
