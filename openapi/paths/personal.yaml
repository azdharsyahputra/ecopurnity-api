      '422': { $ref: '#/components/responses/Validation', description: 'fields: bank (required), accountNo (8-16 digits), holder (required).' }

/me/finance/withdrawals:
  post:
    operationId: createMyWithdrawal
    summary: Withdraw available funds to the payout account
    description: |
      Creates a withdrawal with status `processing` (an admin transfers it by hand, usually within one working day, and
      marks it `paid` with the transfer reference, or `rejected` with a reason: the amount returns to `availableIdr`).
      Requires a saved bank account and `0 < amountIdr <= availableIdr`. Journal: wallet → payout_pending.
    tags: [Personal]
    x-access: session
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalWithdrawalInput' }
    responses:
      '201':
        description: Updated finance overview including the new withdrawal.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Finance' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: amountIdr (no bank account yet, amount not positive, or above the available balance; message states the maximum).' }
    x-note: The 422 field is always amountIdr, even when the problem is the missing bank account. The `no bank` and `over balance` failures share code `validation`.

