# Personal workspace (/me/*) and the participant side of /auctions/{id}/* — mocks/personalHandlers.ts + mocks/contracts.ts.
# Every operation requires a session (cookie ecp_session): 401 `unauthenticated` when missing/unknown user.

/me/dashboard:
  get:
    operationId: getMyDashboard
    summary: Get the personal dashboard summary
    description: |
      Aggregates the caller's workspace. `stats.reputation` is the computed reputation score.
      `actions` is built from: own live bids that are `outbid` (tone red), live bids ending in under 1 hour (orange),
      transactions where the caller still has an available action other than cancel/dispute/review (blue), and at most
      one undiscovered match with 2+ match reasons (lime). `topMatches` = top 3 opportunities with relation `none`.
      `earnings30dIdr` = completed supplier trades of the last 30 days; `savings30dIdr` = opening minus awarded unit price
      x quantity on the caller's reverse/sealed auction purchases of the last 30 days. `connections` = distinct
      counterparties the caller has traded with (count, 3 most recent).
    tags: [Personal]
    x-access: session
    responses:
      '200':
        description: Dashboard summary.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardSummary' }
      '401': { $ref: '#/components/responses/Unauthenticated' }

/me/identity:
  get:
    operationId: getMyIdentity
    summary: Get my identity profile
    tags: [Personal]
    x-access: session
    responses:
      '200':
        description: The caller's identity (profile, capacities, preferences, completeness).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Identity' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
  put:
    operationId: saveMyIdentity
    summary: Replace my identity profile
    description: |
      Replaces the whole identity document. `completeness` is recomputed server-side (the value sent is ignored).
      Also copies `profile.name` and `profile.location` onto the user account (visible in `GET /auth/me`).
    tags: [Personal]
    x-access: session
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Identity' }
    responses:
      '200':
        description: The saved identity with recomputed completeness.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Identity' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: name (required, non-blank profile.name).' }
    x-note: The mock performs no other validation (KTP verification state in the body is trusted; the BE should not accept `profile.verification` changes from this endpoint, those go through /me/kyc).

/me/listings:
  get:
    operationId: listMyListings
    summary: List my supply and demand listings
    description: Not paginated. Newest first.
    tags: [Personal]
    x-access: session
    parameters:
      - name: kind
        in: query
        schema: { type: string, enum: [supply, demand] }
      - name: status
        in: query
        description: A single listing status (supply or demand status value). Exact match.
        schema: { type: string }
    responses:
      '200':
        description: Listings.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Listing' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
  post:
    operationId: createMyListing
    summary: Create a supply or demand listing
    description: |
      `code` is `SUP-xxx` / `DEM-xxx`. A new supply starts `available`, a new demand starts `open`. A history entry
      `Dibuat` is recorded. Restricted accounts cannot create listings (`403 account_restricted`).

      Validation (422, per field): item (non-blank, max 200), quantity (value > 0, unit non-blank), location
      (non-blank), priceIdr (supply, >= 0), budgetIdr (demand, >= 0), deadline (demand, not in the past),
      expiresAt (supply, after availableFrom), attachments (at most 10 names).
    tags: [Personal]
    x-access: session
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ListingInput' }
    responses:
      '201':
        description: The created listing.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Listing' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden', description: 'account_restricted.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: item, quantity, location, priceIdr / budgetIdr, deadline, expiresAt, attachments (see description).' }

/me/listings/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string }
  get:
    operationId: getMyListing
    summary: Get one of my listings with history, matches and markets
    description: '`matches` = up to 3 opportunities in the same category; `markets` = active or forming markets in the same category.'
    tags: [Personal]
    x-access: session
    responses:
      '200':
        description: Listing detail.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingDetail' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: listing is not the caller''s.' }
  patch:
    operationId: updateMyListing
    summary: Update one of my listings
    description: |
      Updates the editable fields that are sent (the ListingInput fields of the listing's kind), validated like create;
      sets `updatedAt` and adds history entry `Diperbarui`. `kind`, `status`, `code` and ids cannot be changed here.
      Fields of the other kind (`priceIdr` on a demand, `budgetIdr` on a supply, ...) are rejected. A listing that is
      finished (sold, expired, fulfilled, cancelled) cannot be edited (`409 not_editable`).
    tags: [Personal]
    x-access: session
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalListingPatch' }
    responses:
      '200':
        description: The updated listing.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Listing' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'not_editable: the listing is finished.' }
      '422': { $ref: '#/components/responses/Validation', description: 'Same fields as create; plus a field of the other kind is rejected.' }
    x-note: The mock merges any body field without validation; the frontend only sends editable fields, so the stricter API is compatible.

/me/listings/{id}/archive:
  post:
    operationId: archiveMyListing
    summary: Archive a listing
    description: Supply listings become `expired`, demand listings become `cancelled`. Adds history entry `Diarsipkan`. No state check (archiving twice is allowed).
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: The archived listing.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Listing' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found.' }

/me/listings/{id}/market:
  post:
    operationId: submitMyListingToMarket
    summary: Put a listing into a market
    description: |
      Sets the listing `in_market` with `marketId`, adds history `Dimasukkan ke <market name>` and marks the caller as
      having joined that market (`/me/markets`). The caller also becomes a market participant (supply listing:
      supplier, demand: buyer), active right away or pending the market maker's approval per the market's settings.
      The market must be `active` or `formation` (`409 market_closed`) and in the listing's category (`422 marketId`);
      a finished listing cannot be moved (`409 not_editable`).
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalListingMarketInput' }
    responses:
      '200':
        description: The updated listing.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Listing' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: listing or market does not exist.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'market_closed, not_editable.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields.marketId: the market is in another category.' }
    x-note: The mock skips the participant entry and the status/category checks.

/me/opportunities:
  get:
    operationId: listMyOpportunities
    summary: List personalised opportunities
    description: |
      Opportunities scored for the caller (`reasons`, `distanceKm`, `relation`, `personalValueIdr`), sorted by score
      descending (reasons*10 - distanceKm/100 + confidence). Not paginated.
      Tab filters: `all` = no filter; `for_you` = has at least one match reason; `nearby` = distanceKm <= 75; `market_gap`, `collective`
      (collective_demand), `supply_gap` = by opportunity kind; `joined` / `following` = by relation.
      `distanceKm` is the great-circle distance from the caller's location (or first preferred location) to the opportunity's
      region (known Indonesian cities/provinces; unknown locations count as 500 km). `Dekat` = the region is the caller's
      or one of their preferred locations. Dismissed/closed opportunities are only listed when the caller is related to them.
    tags: [Personal]
    x-access: session
    parameters:
      - name: tab
        in: query
        schema: { type: string, enum: [all, for_you, nearby, market_gap, collective, supply_gap, joined, following], default: for_you }
        description: Defaults to `for_you`; `all` is the unfiltered list. Any other value is rejected (422).
    responses:
      '200':
        description: Opportunities.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PersonalOpportunity' }
      '401': { $ref: '#/components/responses/Unauthenticated' }

/me/opportunities/{id}/join:
  post:
    operationId: joinOpportunity
    summary: Join an opportunity with a contribution
    description: |
      Sets relation `joined` with the contribution and increases the opportunity's `participants` (once) and its
      `demand` (kind demand) or `supply` (kind supply) quantity by the contributed amount. Re-joining replaces the previous
      contribution. `listingId` must be one of the caller's listings of the contributed kind (422 `fields.listingId`).
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalOpportunityJoinInput' }
    responses:
      '200':
        description: The opportunity as seen by the caller (relation `joined`).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalOpportunity' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: opportunity.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: quantity (quantity.value must be > 0), listingId (not the caller''s listing of that kind).' }
    x-note: The mock does not verify that `listingId` is one of the caller's listings, and re-joining double counts the contribution in the opportunity totals; the API checks the listing and replaces the contribution.

/me/opportunities/{id}/follow:
  post:
    operationId: followOpportunity
    summary: Follow an opportunity
    description: Sets relation `following`, unless the caller already joined it (then it stays `joined`). Idempotent.
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '204': { description: Followed. }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: opportunity.' }
    x-note: The mock does not check that the opportunity exists (no 404); the API answers 404.

/me/opportunities/{id}:
  delete:
    operationId: leaveOpportunity
    summary: Stop following or leave an opportunity
    description: Clears the caller's relation. If the caller had joined, the opportunity's `participants` is decremented and the contributed quantity is taken back out of its demand or supply. Idempotent (also for an unknown id).
    x-note: The mock leaves the contributed quantity in the totals; the API subtracts it.
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '204': { description: Relation cleared. }
      '401': { $ref: '#/components/responses/Unauthenticated' }

/me/markets:
  get:
    operationId: listMyMarkets
    summary: List all markets with my membership state
    description: |
      Every market except drafts (without description/rules/priceHistory/activity/auctions), sorted like
      `GET /markets`, plus `joined`, `watchPriceIdr`, `approval` (membership state in the market maker's participant
      list, only when joined) and `myListings` (count of the caller's listings in that market). Not paginated.
    tags: [Personal]
    x-access: session
    responses:
      '200':
        description: Markets.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/MyMarket' }
      '401': { $ref: '#/components/responses/Unauthenticated' }

/me/markets/{id}/join:
  post:
    operationId: joinMarket
    summary: Join a market
    description: |
      Marks the market joined. Also adds the caller to the market maker's participant list (role `buyer`) with
      status `active` when the market's approval setting is `auto`, otherwise `pending`; a pending request notifies
      the market's operators (type `new_market`, link to the market's participants tab). Idempotent: an existing
      participant row (any status) is kept as is and nobody is notified again. Only `active` and `formation` markets
      accept new members. Checks run in this order: session, account not restricted/suspended, market exists, market
      status.
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '204': { description: Joined. }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden', description: 'account_restricted | account_suspended.' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: market (drafts included).' }
      '409': { $ref: '#/components/responses/Conflict', description: 'market_closed: the market is not active or in formation.' }
    x-note: The mock lets restricted accounts join and accepts any market status; the API refuses both.

/me/markets/{id}/leave:
  post:
    operationId: leaveMarket
    summary: Leave a market
    description: |
      Resets the caller's membership (also clears the price watch) and withdraws the caller's participant request if
      it is still `pending`. An `active`, `rejected` or `suspended` participant row is the market maker's record and
      stays. Idempotent.
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '204': { description: Left. }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: market.' }
    x-note: The mock does not check the market exists and leaves a pending request in the market maker's queue; the API answers 404 and withdraws it.

/me/markets/{id}/watch:
  put:
    operationId: setMarketWatchPrice
    summary: Set or clear the market price alert
    description: Sets the median price alert threshold. A missing or `0` price clears it. Keeps the current joined flag.
    x-note: The mock accepts negative prices and unknown markets; the API answers 422 and 404.
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalMarketWatchInput' }
    responses:
      '204': { description: Saved. }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: market.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: priceIdr (integer, not negative).' }

/me/auctions:
  get:
    operationId: listMyAuctions
    summary: List my auctions as participant and owner
    description: |
      `eligible` = auctions the caller may still bid on (no bid yet, not the owner, status live/extended/qualification/scheduled,
      type not `forward`) with the caller's `qualification` status; `bids` = auctions the caller bid on, as `MyBid`;
      `owned` = auctions the caller created as a buyer, excluding those evaluated in an organization workspace.
    tags: [Personal]
    x-access: session
    responses:
      '200':
        description: The three groups.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalMyAuctions' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
  post:
    operationId: createBuyerAuction
    summary: Open a buyer (reverse or sealed) auction from a demand listing
    description: |
      Creates a live auction for one of the caller's demand listings. Duration starts now; `extension` is fixed at
      2 min window / 5 min extend; visibility is forced to `sealed` for type `sealed`. Value check
      `openingPriceIdr * quantity` against the KYC commitment limit. Side effects: the demand gets `auctionId`
      and status `in_market` (history `Auction <code> dibuat`); audit entry `Buka auction`.
    tags: [Personal]
    x-access: session
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateAuctionInput' }
    responses:
      '201':
        description: The created auction.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuctionDetail' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden', description: 'account_restricted: caller is restricted or suspended by governance. kyc_limit: commitment above the verification level limit.' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: demandId is not one of the caller''s demand listings.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: openingPriceIdr (must be > 0).' }
    x-note: The mock does not validate durationMinutes, minStepIdr, type or that the demand is still open; and does not reject a demand that already has an auction.

/auctions/{id}/me:
  get:
    operationId: getMyAuctionState
    summary: Get my qualification, bid and ownership for an auction
    description: '`evaluateHref` is only present for the owner: the organization evaluate URL when the auction belongs to an org workspace, otherwise `/app/auctions/{id}/evaluate`.'
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Participant state.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalAuctionMe' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: auction.' }

/auctions/{id}/qualification:
  post:
    operationId: qualifyForAuction
    summary: Complete the qualification for an auction
    description: |
      All of document, rules and a verified email are required; on success the caller is `qualified` and the
      returned checklist shows every check done. The reputation check is always passing in the mock.
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalQualificationInput' }
    responses:
      '200':
        description: Updated qualification.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Qualification' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: auction.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: document (documentName required), rules (acceptRules must be true), email (account email not verified). Note the field keys are document/rules, not documentName/acceptRules.' }

/auctions/{id}/bids:
  post:
    operationId: placeBid
    summary: Place or raise a bid
    description: |
      Checks in order: caller not restricted, auction exists, auction `live` or `extended`, caller `qualified`,
      caller is not the owner, KYC commitment limit (`priceIdr * lot quantity`), then bid rules (reverse/sealed: price must be
      <= limit, forward: >= limit, where limit follows the current best price minus the minimum step; sealed ignores the best price).
      The bid status is `submitted` for sealed auctions, `leading` otherwise. Increments `participants` on the first bid and
      `bidCount` always; with `visibility: full` the public bid list and `currentPriceIdr` update.
      Publishes a realtime `auction.bid` event on `auction:{id}` (price masked as 0 unless visibility is full).
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalBidInput' }
    responses:
      '200':
        description: The caller's bid on this auction.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyBid' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden', description: 'account_restricted | not_qualified: finish qualification first | owner: auction creator cannot bid | kyc_limit.' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: auction.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'auction_closed: auction is not live/extended.' }
      '422': { $ref: '#/components/responses/Validation', description: 'invalid_bid: price not a positive number or violates the limit; fields: price.' }

/auctions/{id}/bids/mine:
  delete:
    operationId: withdrawMyBid
    summary: Withdraw my bid
    description: |
      Allowed only when the auction is live/extended, the bid is not `leading` and not already withdrawn, and more than
      30 minutes remain (`MyBid.canWithdraw`). Sets the bid status `withdrawn`.
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: The withdrawn bid.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyBid' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: auction does not exist or the caller has no bid.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'cannot_withdraw: leading bid, last 30 minutes, not live, or already withdrawn.' }

/auctions/{id}/accept:
  post:
    operationId: acceptDutchPrice
    summary: Accept the current price of a Dutch auction
    description: |
      Buys at the current ask (`currentPriceIdr`, else the opening price). Marks the auction `awarded`, the caller's bid
      `won`, creates a buyer transaction against the market maker with 0.5% maker fee, due in 14 days, and notifies the caller
      (`winning_bid`). KYC limit is checked on `price * lot quantity`.
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: The created transaction id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalAcceptResult' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '403': { $ref: '#/components/responses/Forbidden', description: 'account_restricted | not_qualified | kyc_limit.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'auction_closed: auction missing, not a Dutch auction, or not live/extended.' }
    x-note: A missing auction answers 409 auction_closed, not 404.

/auctions/{id}/evaluation:
  get:
    operationId: getAuctionEvaluation
    summary: Get the bid comparison and suggested allocation (buyer)
    description: |
      Owner only. One offer per bidder (the bidder's lowest price; capacity and reputation are synthesized in the mock,
      the BE should use real supplier data). `suggestion` is Smart Allocation: cheapest offers first (reputation breaks ties),
      each up to its capacity, until the lot is covered. `savingsIdr` = opening price * covered quantity - total.
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Evaluation.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuctionEvaluation' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: auction missing or the caller is not its owner.' }

/auctions/{id}/award:
  post:
    operationId: awardAuction
    summary: Award a closed auction to one or more suppliers (buyer)
    description: |
      Owner only, auction must be `closed`. Marks it `awarded`, writes an audit entry `Tetapkan pemenang` with one change
      per line, and creates one buyer transaction per line (maker fee 0.5%). A line whose offer was placed by a platform
      account becomes a linked two-sided trade (the supplier gets a record and an agreement notification); otherwise the
      counterparty is a fictional party played by a bot. Other participants' bids become `won` (selected suppliers) or
      `lost`, each notified (`winning_bid` / `auction_ending`). The owner's demand listing becomes `matched` (history
      `Award ke N supplier`).
    tags: [Personal]
    x-access: session
    x-audit: true
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalAwardInput' }
    responses:
      '200':
        description: Created transactions (owner's records, same order as `lines`).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalAwardResult' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: auction missing or the caller is not its owner.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'not_closed: award is only possible after the auction closed.' }
      '422': { $ref: '#/components/responses/Validation', description: 'validation: lines must contain at least one entry.' }
    x-note: The mock does not validate that lines reference real offers, do not exceed offer capacity or the lot quantity, and does not apply the KYC limit or the account_restricted check on award. The BE should validate these.

