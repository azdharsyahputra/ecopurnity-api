/me/contracts:
  get:
    operationId: listMyContracts
    summary: List my standing supply contracts
    description: Contracts where the caller is buyer or supplier, newest first, with the caller's `side` and the actions open to that side. Not paginated.
    tags: [Personal]
    x-access: session
    responses:
      '200':
        description: Contracts.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ContractView' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
  post:
    operationId: createContract
    summary: Propose a standing supply contract from a completed transaction
    description: |
      Copies item (title before ` · `), quantity, unit price and payment terms (default `escrow`) from one of the caller's
      completed transactions; the caller proposes in their own role (`proposedBy`) and the other side must accept. The
      first run is at 08:00 on `startAt`. Status starts `proposed`, code `CTR-xxxx`. Writes an audit entry
      and notifies the counterparty when they are a platform account. A counterparty that is not on the platform accepts
      only when the server simulates counterparties (`SIMULATE_COUNTERPARTIES`, demo: after ~8 seconds, status `active`,
      the proposer is notified). When due, an order (a normal two-sided trade titled `<item> · order n/runs (<code>)`) is
      placed automatically, `nextAt` advances by the frequency, and the contract `ended`s after the last run. The first
      run is at 08:00 Jakarta time (WIB).
    tags: [Personal]
    x-access: session
    x-audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalContractCreateInput' }
    responses:
      '201':
        description: The proposed contract.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractView' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: fromTx is not one of the caller''s transactions.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'not_completed: the source transaction is not `completed`.' }
      '422': { $ref: '#/components/responses/Validation', description: 'fields: every (weekly|biweekly|monthly required), runs (integer 2-52), startAt (YYYY-MM-DD, today or later).' }
    x-note: The `409 not_completed` check runs before field validation. `startAt` is compared as a plain date string against today's UTC date.

/me/contracts/{id}:
  get:
    operationId: getContract
    summary: Get one of my contracts
    tags: [Personal]
    x-access: session
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: The contract as seen by the caller.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractView' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: contract missing or the caller is not a party.' }

/me/contracts/{id}/actions:
  post:
    operationId: applyContractAction
    summary: Act on a standing contract
    description: |
      Actions by status and side (`ContractView.actions` lists what is currently allowed):
      - `proposed`: the proposer can `end`; the other side can `accept` (-> `active`) or `decline` (-> `declined`).
      - `active`: buyer can `run_now` (places the next order immediately, status stays `active`), `pause` (-> `paused`) or `end`; supplier can `pause` or `end`.
      - `paused`: either side can `resume` (-> `active`, next run moves to now if it is overdue) or `end`.
      - `ended` / `declined`: no actions.
      Writes an audit entry and notifies the counterparty (except for `run_now`, which notifies both sides about the created order instead).
    tags: [Personal]
    x-access: session
    x-audit: true
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalContractActionInput' }
    responses:
      '200':
        description: The updated contract.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractView' }
      '401': { $ref: '#/components/responses/Unauthenticated' }
      '404': { $ref: '#/components/responses/NotFound', description: 'not_found: contract missing or the caller is not a party.' }
      '409': { $ref: '#/components/responses/Conflict', description: 'invalid_transition: action not available now for this side/status.' }
